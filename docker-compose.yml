# Polaris Workforce — the whole platform on one machine.
#
#   cp .env.example .env            # then set DJANGO_SECRET_KEY and TRACKER_SHARED_SECRET
#   docker compose up -d --build    # http://localhost:8080
#   docker compose run --rm web manage seed_demo      # optional demo data
#
# Services: nginx (entry point) → web (Django + gunicorn) and tracker (Gleam); worker
# (Celery) rebuilds pay figures in the background and runs the jobs beat schedules
# (messaging, refresh_precomputed); redis is their queue. Data lives in the `data` volume
# (SQLite in WAL mode, uploads, throttle cache). The Flutter foreman app is not a server: point it at
# http://<this machine>:8080/api/v1/ (see docs/docker.md).

x-django-env: &django-env
  DJANGO_DEBUG: "false"
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?set DJANGO_SECRET_KEY in .env}
  DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
  DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080}
  DJANGO_TIME_ZONE: ${DJANGO_TIME_ZONE:-UTC}
  # One proxy (nginx) sets X-Forwarded-For: the PIN and sign-in limits key on the real IP.
  DJANGO_NUM_PROXIES: "1"
  # Plain HTTP on localhost by default; set both to true once HTTPS is in front.
  DJANGO_SECURE_SSL_REDIRECT: ${DJANGO_SECURE_SSL_REDIRECT:-false}
  DJANGO_SECURE_COOKIES: ${DJANGO_SECURE_COOKIES:-false}
  DJANGO_HSTS_SECONDS: ${DJANGO_HSTS_SECONDS:-0}
  SQLITE_PATH: /data/db.sqlite3
  MEDIA_ROOT: /data/media
  DJANGO_CACHE_DIR: /data/cache
  PROTECTED_MEDIA_MODE: nginx
  PROTECTED_MEDIA_INTERNAL_URL: /protected-media/
  DEVICE_TOKEN_IDLE_DAYS: ${DEVICE_TOKEN_IDLE_DAYS:-30}
  MESSAGING_PROVIDER: ${MESSAGING_PROVIDER:-log}
  CELERY_BROKER_URL: redis://redis:6379/0

services:
  web:
    build: ./polaris_workforce
    image: polaris-workforce:latest
    command: ["web"]
    environment: *django-env
    volumes:
      - data:/data
      - static:/app/staticfiles
    expose:
      - "8000"
    restart: unless-stopped

  # The queue only: a lost task costs a rebuild a few minutes later (beat's periodic
  # run, or the next screen that reads the site), so nothing is persisted.
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    expose:
      - "6379"
    restart: unless-stopped

  worker:
    build: ./polaris_workforce
    image: polaris-workforce:latest
    command: ["worker"]
    environment:
      <<: *django-env
      CELERY_CONCURRENCY: ${CELERY_CONCURRENCY:-2}
    volumes:
      - data:/data
    healthcheck:
      test: ["CMD", "celery", "-A", "config", "inspect", "ping", "--timeout", "5"]
      interval: 60s
      timeout: 15s
      retries: 3
    depends_on:
      redis:
        condition: service_started
      web:
        condition: service_healthy  # migrations ran
    restart: unless-stopped

  beat:
    build: ./polaris_workforce
    image: polaris-workforce:latest
    command: ["beat"]
    environment: *django-env
    healthcheck:
      disable: true
    depends_on:
      redis:
        condition: service_started
      web:
        condition: service_healthy
    restart: unless-stopped

  tracker:
    build: ./polaris_tracker
    image: polaris-tracker:latest
    environment:
      TRACKER_SHARED_SECRET: ${TRACKER_SHARED_SECRET:?set TRACKER_SHARED_SECRET in .env}
      TRACKER_BIND: 0.0.0.0
      TRACKER_PORT: "4100"
      TRACK_RETENTION_DAYS: ${TRACK_RETENTION_DAYS:-30}
      # DJANGO_EVENTS_URL is deliberately not set: the tracker then only logs events
      # (Django's presence endpoint is not built yet). An empty value would be rejected,
      # so add it here only with a real URL, e.g. http://web:8000/api/v1/presence/events/
    expose:
      - "4100"
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${POLARIS_PORT:-8080}:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - static:/srv/static:ro
      - data:/data:ro
    depends_on:
      web:
        condition: service_healthy
      tracker:
        condition: service_started
    restart: unless-stopped

volumes:
  data:
  static:

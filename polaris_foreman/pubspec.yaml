name: polaris_foreman
description: "Polaris Workforce foreman app: roll call and cash payout, offline first."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.8.0

# Versions are pinned to packages already in the local pub cache (slow network).
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: 2.6.1
  go_router: 14.8.1
  sqflite: 2.4.2
  path: ^1.9.1
  path_provider: 2.1.5
  uuid: 4.5.1
  intl: 0.20.2
  image_picker: 1.1.2
  flutter_secure_storage: 9.2.4
  timezone: 0.10.1
  http: 1.6.0
  http_parser: 4.1.2
  crypto: ^3.0.6
  mobile_scanner: 7.0.1
  geolocator: 13.0.4
  device_info_plus: 10.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  yaml: 3.1.3

flutter:
  uses-material-design: true
  generate: true
  # Inter (body) and Archivo (headings), bundled: no network fonts. Static
  # Latin instances of the variable WOFF2 files the office dashboard
  # self-hosts (licence: assets/fonts/OFL.txt).
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-400.ttf
          weight: 400
        - asset: assets/fonts/Inter-600.ttf
          weight: 600
        - asset: assets/fonts/Inter-700.ttf
          weight: 700
        - asset: assets/fonts/Inter-800.ttf
          weight: 800
    - family: Archivo
      fonts:
        - asset: assets/fonts/Archivo-700.ttf
          weight: 700
        - asset: assets/fonts/Archivo-800.ttf
          weight: 800

name = "polaris_tracker"
version = "0.1.0"
# Built and tested with Gleam 1.19.2 on Erlang/OTP 28 (see README, "Gleam version").
gleam = ">= 1.14.0"

# Fill out these fields if you intend to generate HTML documentation or publish
# your project to the Hex package manager.
#
# description = ""
# licences = ["Apache-2.0"]
# repository = { type = "github", user = "", repo = "" }
# links = [{ title = "Website", href = "" }]
#
# For a full reference of all the available options, you can have a look at
# https://gleam.run/writing-gleam/gleam-toml/.

[dependencies]
# Gleam 1.14+ lets these float to their latest releases (mist 6, glisten 9,
# gleam_json 3.1+, stdlib 0.68+); manifest.toml holds the exact versions.
gleam_stdlib = ">= 0.68.0 and < 2.0.0"
gleam_erlang = ">= 1.3.0 and < 2.0.0"
gleam_otp = ">= 1.3.0 and < 2.0.0"
gleam_http = ">= 4.5.0 and < 5.0.0"
gleam_json = ">= 3.1.0 and < 4.0.0"
gleam_crypto = ">= 1.5.1 and < 2.0.0"
gleam_time = ">= 1.11.0 and < 2.0.0"
mist = ">= 6.0.0 and < 7.0.0"
gleam_httpc = ">= 5.0.0 and < 6.0.0"

[dev-dependencies]
gleeunit = ">= 1.9.0 and < 2.0.0"

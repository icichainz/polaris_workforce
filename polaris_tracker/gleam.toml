[dependencies]
gleam_stdlib = ">= 0.60.0 and < 0.68.0"
gleam_erlang = ">= 1.3.0 and < 2.0.0"
gleam_otp = ">= 1.3.0 and < 2.0.0"
gleam_http = ">= 4.5.0 and < 5.0.0"
# Pinned below releases that need Gleam 1.13 (gleam_json 3.1, exception
# 2.1.1). CI and dev machines run Gleam 1.12; relax these after upgrading.
gleam_json = ">= 3.0.0 and < 3.1.0"
exception = ">= 2.0.0 and < 2.1.1"
gleam_crypto = ">= 1.5.1 and < 2.0.0"
gleam_time = ">= 1.11.0 and < 2.0.0"
mist = ">= 5.0.0 and < 6.0.0"
gleam_httpc = ">= 5.0.0 and < 6.0.0"

[dev-dependencies]
gleeunit = ">= 1.0.0 and < 1.7.0"

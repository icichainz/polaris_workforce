[project]
name = "polaris-workforce"
version = "0.1.0"
description = "Attendance and daily pay for construction crews"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "django>=6.1.2",
    "djangorestframework>=3.18.3",
    "drf-spectacular>=0.30.0",
    "gunicorn>=26.2.0",
    "openpyxl>=3.1.5",
    "segno>=1.6.6",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-django>=4.14.0",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
pythonpath = ["."]
testpaths = ["tests", "apps"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["**/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DJ"]

{% load i18n %}{% comment %}
Links between the payout screens. Context: `current` ("batches" | "accounts" | "layouts").
{% endcomment %}<nav aria-label="{% translate 'Payout screens' %}" class="flex flex-wrap gap-1 self-start rounded-card bg-segment p-1">
  <a href="{% url 'payouts:batches' %}"{% if current == "batches" %} aria-current="page"{% endif %} class="flex h-8 items-center rounded-[7px] px-3 text-[13px] font-semibold no-underline {% if current == 'batches' %}bg-surface text-ink{% else %}text-ink-700 hover:text-ink{% endif %}">{% translate "Batches" %}</a>
  <a href="{% url 'payouts:accounts' %}"{% if current == "accounts" %} aria-current="page"{% endif %} class="flex h-8 items-center rounded-[7px] px-3 text-[13px] font-semibold no-underline {% if current == 'accounts' %}bg-surface text-ink{% else %}text-ink-700 hover:text-ink{% endif %}">{% translate "Payout accounts" %}</a>
  <a href="{% url 'payouts:layouts' %}"{% if current == "layouts" %} aria-current="page"{% endif %} class="flex h-8 items-center rounded-[7px] px-3 text-[13px] font-semibold no-underline {% if current == 'layouts' %}bg-surface text-ink{% else %}text-ink-700 hover:text-ink{% endif %}">{% translate "Export layouts" %}</a>
</nav>

      operationId: sync
      description: |-
        Days (statuses, approvals, rejections, payout status), records and corrections changed after `since`, for every site the user is assigned to. Without `since` (first sync): the last 14 days.

        Store `server_time` and send it as `since` next time. **The server wins**: apply every item as an upsert by id; a record corrected in the office replaces the phone's copy (keep unsent outbox writes and resend them; they get `423`/`409` if no longer allowed, which the app shows to the foreman).
      summary: Changes since the last sync
      parameters:
      - in: query
        name: since
        schema:
          type: string
          format: date-time
        description: '`server_time` of the previous sync (ISO 8601 with offset).'
      tags:
      - attendance
      security:
      - DeviceToken: []
      - cookieAuth: []

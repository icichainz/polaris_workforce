          format: uuid
          description: Made on the phone when the user acts (UUID v4). Sending the
            same client_uuid again returns the original result instead of applying
            the write twice.
        accepted:
          type: boolean
          description: 'true: the foreman accepted the notice; false: refused or withdrawn
            (taken at any time).'
        text_version:
          type: string
          minLength: 1
          description: The version of the notice shown (`details.text_version` of
            the `consent_required` answer; today `2026-11-01`). An acceptance must
            name the current one; a refusal may name any.
          maxLength: 32
      required:
      - accepted
      - client_uuid
      - text_version
    CorrectableFieldEnum:
      enum:

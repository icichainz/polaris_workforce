      operationId: site_presence_sessions
      description: |-
        For the roll call and the approvals screen: one row per person seen on the site that day (visits started that day, company time zone), first arrival first, with the first and last sighting and the zones visited. `open` rows have no `last_seen_at`: the person is still on site. The phone shows "seen 07:02–16:48, zone B" next to the worker; accepting it goes through the normal records upsert (its own `client_uuid` and audit entry). Presence never marks attendance.

        Site-scoped like every endpoint: a site you are not assigned to is `403`.
      summary: Presence sessions of a site for a day
      parameters:
      - in: query
        name: date
        schema:
          type: string
        description: Work day, ISO 8601 `YYYY-MM-DD`, in the company time zone.
        required: true
      - in: path
        name: site_id
        schema:
          type: integer
        description: A site the signed-in foreman is assigned to (from `GET /me/`).
        required: true
      tags:
      - presence
      security:
      - DeviceToken: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SitePresenceSessions'
              examples:
                Sessions:
                  value:
                    site_id: 3
                    date: '2026-10-31'
                    sessions:
                    - subject:
                        kind: worker
                        id: 63
                      first_seen_at: '2026-10-31T07:02:40Z'
                      last_seen_at: '2026-10-31T16:48:21Z'
                      open: false
                      zones:
                      - A
                      - B
                      visits: 1
                    - subject:
                        kind: foreman
                        id: 7
                      first_seen_at: '2026-10-31T07:05:00Z'
                      last_seen_at: null
                      open: true
                      zones: []
                      visits: 1
                    - subject:
                        kind: worker
                        id: 58
                      first_seen_at: '2026-10-31T07:31:10Z'
                      last_seen_at: null
                      open: true
                      zones:
                      - A
                      visits: 2
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                ValidationError:
                  value:
                    code: validation_error
                    message: Invalid input.
                    details:
                      client_uuid:
                      - This field is required.
                  summary: validation_error
          description: The request is invalid; `details` maps each field to its errors.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                NotAuthenticated:
                  value:
                    code: not_authenticated
                    message: Invalid or revoked device token.
                    details: {}
                  summary: not_authenticated
          description: Missing, invalid or revoked device token. Sign in again with
            the PIN.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                PermissionDenied:
                  value:
                    code: permission_denied
                    message: You do not have permission to perform this action.
                    details: {}
                  summary: permission_denied
          description: Signed in, but not allowed (for example a site you are not
            assigned to).
  /api/v1/sync/:
    get:
      operationId: sync
      description: |-
        Days (statuses, approvals, rejections, payout status), records and corrections changed after `since`, for every site the user is assigned to. Without `since` (first sync): the last 14 days.

        Store `server_time` and send it as `since` next time. **The server wins**: apply every item as an upsert by id; a record corrected in the office replaces the phone's copy (keep unsent outbox writes and resend them; they get `423`/`409` if no longer allowed, which the app shows to the foreman).
      summary: Changes since the last sync
      parameters:
      - in: query
        name: since
        schema:
          type: string
          format: date-time
        description: '`server_time` of the previous sync (ISO 8601 with offset).'
      tags:
      - attendance
      security:
      - DeviceToken: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sync'
              examples:
                Changes:
                  value:
                    server_time: '2026-10-31T16:12:30Z'
                    since: '2026-10-31T07:45:00Z'
                    days:
                    - id: 210
                      site_id: 3
                      date: '2026-10-31'
                      status: approved
                      foreman_note: Concrete delivery late, Delali started 07:35.
                      submitted_at: '2026-10-31T07:42:05Z'
                      submitted_by:
                        id: 7
                        name: Kossi Amegah
                      approved_at: '2026-10-31T16:10:00Z'
                      approved_by:
                        id: 4
                        name: Edem Kpodar
                      rejection_note: ''
                      counts:
                        expected: 4
                        present: 1
                        absent: 1
                        half_day: 1
                        late: 1
                        unmarked: 0
                      payout_status: open
                      updated_at: '2026-10-31T16:10:00Z'
                    records:
                    - id: 9003
                      client_uuid: a1e5f9c3-2d4b-4f7e-8a06-b3c2d1e0f932
                      day_id: 210
                      site_id: 3
                      date: '2026-10-31'
                      worker_id: 63
                      status: late
                      arrival: '07:20'
                      departure: null
                      note: ''
                      corrected: true
                      updated_at: '2026-10-31T09:15:00Z'
                    corrections:
                    - id: 77
                      client_uuid: 5e9d0c4b-3a2f-4e1d-9b8c-7a6f5e4d3c21
                      record_id: 9003
                      field: arrival
                      old_value: '07:35'
                      new_value: '07:20'
                      reason: Signed in at the gate at 07:20; marked late by mistake.
                      created_by:
                        id: 7
                        name: Kossi Amegah
                      created_at: '2026-10-31T09:15:00Z'
                      record:
                        id: 9003
                        client_uuid: a1e5f9c3-2d4b-4f7e-8a06-b3c2d1e0f932
                        day_id: 210
                        site_id: 3
                        date: '2026-10-31'
                        worker_id: 63
                        status: late
                        arrival: '07:20'
                        departure: null
                        note: ''
                        corrected: true
                        updated_at: '2026-10-31T09:15:00Z'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                ValidationError:
                  value:
                    code: validation_error
                    message: Invalid input.
                    details:
                      client_uuid:
                      - This field is required.
                  summary: validation_error
          description: The request is invalid; `details` maps each field to its errors.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                NotAuthenticated:
                  value:
                    code: not_authenticated
                    message: Invalid or revoked device token.
                    details: {}
                  summary: not_authenticated
          description: Missing, invalid or revoked device token. Sign in again with
            the PIN.
  /api/v1/tracking/consent/:
    post:
      operationId: tracking_consent
      description: |-
        The foreman's answer to the notice shown on the phone. Accepting the current version opens `POST /tracking/token/`; refusing, or withdrawing an earlier acceptance, is recorded too and makes it answer `403 tracking_disabled` (`reason: consent_refused`) until an acceptance. The latest answer counts. Each answer writes an audit entry.

        `accepted: false` is taken at any time, whatever `text_version` it names. `accepted: true` must name the current notice (`details.text_version` of `consent_required`), else `400`.

        Idempotent: the same `client_uuid` again returns the original answer (`200`, `Idempotent-Replayed: true`); used by another user, `409 conflict`.
      summary: Accept or refuse the tracking notice
      tags:
      - presence
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConsentRequestRequest'
            examples:
              Accept:
                value:
                  client_uuid: 0d9b6f3e-7a7c-4f43-9c1e-5b0a4d6f2e11
                  accepted: true
                  text_version: '2026-11-01'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ConsentRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ConsentRequestRequest'
        required: true
      security:
      - DeviceToken: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Consent'
              examples:
                Accepted:
                  value:
                    accepted: true
                    at: '2026-10-31T06:01:12Z'
                    text_version: '2026-11-01'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                OldNotice:
                  value:
                    code: validation_error
                    message: Invalid input.
                    details:
                      text_version:
                      - 'The notice has changed: show version 2026-11-01 and ask again.'
                  summary: Old notice
          description: The request is invalid; `details` maps each field to its errors.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                NotAuthenticated:
                  value:
                    code: not_authenticated
                    message: Invalid or revoked device token.
                    details: {}
                  summary: not_authenticated
          description: Missing, invalid or revoked device token. Sign in again with
            the PIN.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                PermissionDenied:
                  value:
                    code: permission_denied
                    message: You do not have permission to perform this action.
                    details: {}
                  summary: permission_denied
          description: Signed in, but not allowed (for example a site you are not
            assigned to).
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                Conflict:
                  value:
                    code: conflict
                    message: This client_uuid was already used for a different request.
                    details:
                      client_uuid: 6f1c2b9e-1d1a-4c55-9a52-3f0e8a9d7b10
                  summary: conflict
          description: The request conflicts with the current state.
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                Throttled:
                  value:
                    code: throttled
                    message: Request was throttled. Expected available in 42 seconds.
                    details:
                      retry_after: 42
                  summary: throttled
          description: Too many requests. Wait `details.retry_after` seconds (also
            in `Retry-After`).
  /api/v1/tracking/token/:
    post:
      operationId: tracking_token
      description: |-
        A `device` JWT for the tracker (claims v2): `sub = "foreman:<user id>"`, `company`, `sites` = your sites where `tracking_enabled` is on, `travel` (true for company admins), `aud = "polaris-tracker"`, 12 hours. Call it after the PIN sign-in and again before `expires_at`.

        `settings`: the resolved settings the phone needs, over the token's sites (shortest GPS interval, earliest start and latest end of the tracking hours, and the retention of raw positions).

        Refusals (`403`), in this order:
        - `tracking_disabled` with `details.reason = settings`: tracking is off on all of your sites; show no tracking screens.
        - `tracking_disabled` with `details.reason = consent_refused`: you declined the notice (the latest answer); `POST /tracking/consent/` with `accepted: true` turns it on.
        - `consent_required`: no answer yet, or the notice changed since you accepted it. Show the notice of version `details.text_version`, then `POST /tracking/consent/`.

        Both consent refusals give, in `details`, what the notice shows: `text_version`, `tracking_hours {start, end}`, `gps_interval_seconds` and `retention_days`.

        A foreman is a user, not a worker: the worker-level `tracking_enabled` does not apply; the foreman's own switch is their consent. Throttled per user (`tracking` scope, 30/minute).
      summary: Get a tracker token for this foreman's phone
      tags:
      - presence
      security:
      - DeviceToken: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrackingToken'
              examples:
                Token:
                  value:
                    token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiJmb3JlbWFuOjciLCJraW5kIjoiZGV2aWNlIiwiY29tcGFueSI6MSwic2l0ZXMiOlszXSwidHJhdmVsIjpmYWxzZSwiYXVkIjoicG9sYXJpcy10cmFja2VyIiwiZXhwIjoxNzkzNDY4MDAwfQ.c2lnbmF0dXJl
                    expires_at: '2026-10-31T18:00:00Z'
                    tracker_url: https://tracker.example.com
                    sites:
                    - 3
                    settings:
                      gps_interval_seconds: 60
                      tracking_hours:
                        start: '06:00'
                        end: '19:00'
                      retention_days: 30
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                NotAuthenticated:
                  value:
                    code: not_authenticated
                    message: Invalid or revoked device token.
                    details: {}
                  summary: not_authenticated
          description: Missing, invalid or revoked device token. Sign in again with
            the PIN.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                TrackingOffOnYourSites:
                  value:
                    code: permission_denied
                    message: Tracking is not enabled for you.
                    details:
                      reason: settings
                  summary: Tracking off on your sites
                ConsentRefused:
                  value:
                    code: permission_denied
                    message: You declined tracking. Accept the notice to turn it on.
                    details:
                      reason: consent_refused
                      text_version: '2026-11-01'
                      tracking_hours:
                        start: '06:00'
                        end: '19:00'
                      gps_interval_seconds: 60
                      retention_days: 30
                  summary: Consent refused
                ConsentRequired:
                  value:
                    code: permission_denied
                    message: Accept the tracking notice first.
                    details:
                      text_version: '2026-11-01'
                      tracking_hours:
                        start: '06:00'
                        end: '19:00'
                      gps_interval_seconds: 60
                      retention_days: 30
                  summary: Consent required
          description: '`tracking_disabled` or `consent_required` (see above); `permission_denied`
            for a user who is not a foreman or an admin.'
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                Throttled:
                  value:
                    code: throttled
                    message: Request was throttled. Expected available in 42 seconds.
                    details:
                      retry_after: 42
                  summary: throttled
          description: Too many requests. Wait `details.retry_after` seconds (also
            in `Retry-After`).
components:
  schemas:
    Alert:
      type: object
      properties:
        kind:
          $ref: '#/components/schemas/KindEnum'
        severity:
          $ref: '#/components/schemas/SeverityEnum'
        site:
          type: string
        site_id:
          type: integer
          nullable: true
        date:
          type: string
          format: date
          nullable: true
        count:
          type: integer
        person:
          type: string
        detail:
          type: string
        worker_id:
          type: integer
          nullable: true
        day_id:
          type: integer
          nullable: true
      required:
      - count
      - date
      - day_id
      - detail
      - kind
      - person
      - severity
      - site
      - site_id
      - worker_id
    Approvals:
      type: object
      properties:
        days:
          type: array
          items:
            $ref: '#/components/schemas/WaitingDay'
      required:
      - days
    AssignedSite:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        address:
          type: string
        manager:
          allOf:
          - $ref: '#/components/schemas/PersonRef'
          nullable: true
          description: Site manager who approves the roll call.
        work_start:
          type: string
          pattern: ^([01]\d|2[0-3]):[0-5]\d$
          example: '07:00'
          description: 'Usual start of the work day: default arrival time.'
          nullable: true
        roll_call_due:
          type: string
          pattern: ^([01]\d|2[0-3]):[0-5]\d$
          example: '07:00'
          description: Time by which the morning roll call should be submitted.
          nullable: true
      required:
      - address
      - id
      - manager
      - name
      - roll_call_due
      - work_start
    AttendanceDay:
      type: object
      properties:
        id:
          type: integer
          nullable: true
          description: Null while the day is `not_started` (no row on the server).
        site_id:
          type: integer
        date:
          type: string
          format: date
        status:
          $ref: '#/components/schemas/DayStatusEnum'
        foreman_note:
          type: string
        submitted_at:
          type: string
          format: date-time
          nullable: true
        submitted_by:
          allOf:
          - $ref: '#/components/schemas/PersonRef'
          nullable: true
        approved_at:
          type: string
          format: date-time
          nullable: true
        approved_by:
          allOf:
          - $ref: '#/components/schemas/PersonRef'
          nullable: true
        rejection_note:
          type: string
          description: Why the site manager sent the day back (status rejected).
        counts:
          $ref: '#/components/schemas/DayCounts'
        payout_status:
          allOf:
          - $ref: '#/components/schemas/PayoutStatusEnum'
          description: |-
            State of the day's cash payout.

            * `not_open` - Not open (waiting for approval)
            * `open` - Open
            * `paid` - Everyone paid
            * `closed` - Closed by the office
        updated_at:
          type: string
          format: date-time
          nullable: true
        records:
          type: array
          items:
            $ref: '#/components/schemas/AttendanceRecord'
      required:
      - approved_at
      - approved_by
      - counts
      - date
      - foreman_note
      - id
      - payout_status
      - records
      - rejection_note
      - site_id
      - status
      - submitted_at
      - submitted_by
      - updated_at
    AttendanceDayList:
      type: object
      properties:
        site_id:
          type: integer
        days:
          type: array
          items:
            $ref: '#/components/schemas/AttendanceDaySummary'
      required:
      - days
      - site_id
    AttendanceDaySummary:
      type: object
      properties:
        id:
          type: integer
          nullable: true
          description: Null while the day is `not_started` (no row on the server).
        site_id:
          type: integer
        date:
          type: string
          format: date
        status:
          $ref: '#/components/schemas/DayStatusEnum'
        foreman_note:
          type: string
        submitted_at:
          type: string
          format: date-time
          nullable: true
        submitted_by:
          allOf:
          - $ref: '#/components/schemas/PersonRef'
          nullable: true
        approved_at:
          type: string
          format: date-time
          nullable: true
        approved_by:
          allOf:
          - $ref: '#/components/schemas/PersonRef'
          nullable: true
        rejection_note:
          type: string
          description: Why the site manager sent the day back (status rejected).
        counts:
          $ref: '#/components/schemas/DayCounts'
        payout_status:
          allOf:
          - $ref: '#/components/schemas/PayoutStatusEnum'
          description: |-
            State of the day's cash payout.

            * `not_open` - Not open (waiting for approval)
            * `open` - Open
            * `paid` - Everyone paid
            * `closed` - Closed by the office
        updated_at:
          type: string
          format: date-time
          nullable: true
      required:
      - approved_at
      - approved_by
      - counts
      - date
      - foreman_note
      - id
      - payout_status
      - rejection_note
      - site_id
      - status
      - submitted_at
      - submitted_by
      - updated_at
    AttendanceModeEnum:
      enum:
      - foreman_roll_call
      - self_check_in
      - both
      type: string
      description: |-
        * `foreman_roll_call` - Foreman roll call
        * `self_check_in` - Self check-in
        * `both` - Both
    AttendanceRecord:
      type: object
      properties:
        id:
          type: integer
        client_uuid:
          type: string
          format: uuid
          description: The server's client_uuid for this record. The phone adopts
            it if it differs from its own (the same worker was marked from two phones).
        day_id:
          type: integer
        site_id:
          type: integer
          description: The day's site (same as the day's `site_id`).
        date:
          type: string
          format: date
          description: The day's date (same as the day's `date`).
        worker_id:
          type: integer
        status:
          $ref: '#/components/schemas/AttendanceStatusEnum'
        arrival:
          type: string
          pattern: ^([01]\d|2[0-3]):[0-5]\d$
          example: '07:00'
          description: Local wall-clock time on the site, 24-hour `HH:MM`.
          nullable: true
        departure:
          type: string
          pattern: ^([01]\d|2[0-3]):[0-5]\d$
          example: '07:00'
          description: Local wall-clock time on the site, 24-hour `HH:MM`.
          nullable: true
        note:
          type: string
        corrected:
          type: boolean
          description: True once a correction was applied after submission.
        updated_at:
          type: string
          format: date-time
      required:
      - arrival
      - client_uuid
      - corrected
      - date
      - day_id
      - departure
      - id
      - note
      - site_id
      - status
      - updated_at
      - worker_id
    AttendanceStatusEnum:
      enum:
      - present
      - absent
      - half_day
      - late
      type: string
      description: |-
        * `present` - Present
        * `absent` - Absent
        * `half_day` - Half day
        * `late` - Late
    BadgeHash:
      type: object
      properties:
        worker_id:
          type: integer
        payload_sha256:
          type: string
          description: Hex SHA-256 of the badge's QR text (UTF-8, as printed, with
            `PW1:`).
        issued_at:
          type: string
          format: date-time
      required:
      - issued_at
      - payload_sha256
      - worker_id
    Change:
      type: object
      properties:
        field:
          type: string
        old:
          type: string
        new:
          type: string
        reason:
          type: string
        at:
          type: string
          description: '`HH:MM`, local time.'
      required:
      - at
      - field
      - new
      - old
      - reason
    CheckIn:
      type: object
      properties:
        id:
          type: integer
        client_uuid:
          type: string
          format: uuid
        site_id:
          type: integer
        worker_id:
          type: integer
          nullable: true
          description: '`null` for a badge the server does not know.'
        date:
          type: string
          format: date
          description: Work day of `at` in the company time zone.
        direction:
          $ref: '#/components/schemas/DirectionEnum'
        at:
          type: string
          format: date-time
        received_at:
          type: string
          format: date-time
        source:
          $ref: '#/components/schemas/SourceEnum'
        latitude:
          type: number
          format: double
          maximum: 1000
          minimum: -1000
          exclusiveMaximum: true
          exclusiveMinimum: true
          nullable: true
        longitude:
          type: number
          format: double
          maximum: 1000
          minimum: -1000
          exclusiveMaximum: true
          exclusiveMinimum: true
          nullable: true
        accuracy_m:
          type: integer
          nullable: true
        distance_m:
          type: integer
          nullable: true
          description: 'Distance from the geofence centre (no GPS or no geofence:
            null).'
        inside_geofence:
          type: boolean
          nullable: true
          description: '`null` without GPS or when the site has no geofence.'
        counted:
          type: boolean
          description: Counts towards the roll call (known worker, badge not revoked).
        draft_updated:
          type: boolean
          description: '`self_check_in` mode: this check-in wrote the worker''s draft
            record.'
        flags:
          type: array
          items:
            $ref: '#/components/schemas/FlagsEnum'
        photo_url:
          type: string
          format: uri
          nullable: true
          description: Protected download (send the `Authorization` header); null
            without a photo.
      required:
      - accuracy_m
      - at
      - client_uuid
      - counted

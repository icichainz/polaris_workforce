  /api/v1/presence/events/:
    post:
      operationId: presence_events
      description: |-
        Called by the tracker's outbox (service token), in batches of up to 500, oldest first. Each event is stored once by `event_id`; the sessions of the people in the batch are then rebuilt from every stored event in time order (`entered` opens a visit, `moved_zone` adds its zone, `left` closes it), so late, out-of-order or repeated events give the same sessions, and replaying a batch changes nothing.

        Every item is counted once: `stored` (new, applied), `duplicates`, `ignored` (new and stored, but not applied: an unknown site or subject, or one of another company; a site of an inactive company; a worker who is inactive or has tracking off; a foreman who had not accepted the notice at the event's time) and `rejected` (an item that does not match the schema: not stored, logged). Any `200` means the batch is delivered. `400` only for a body that is not `{events: [...]}` or has more than 500 events.

        Presence events are not attendance changes: no audit entry each.
      summary: Presence events from the tracker
      tags:
      - presence
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PresenceEventBatchRequest'
            examples:
              Batch:
                value:
                  events:
                  - event_id: 1b4e28ba-2fa1-41d2-883f-0016d3cca427
                    site_id: 3
                    subject:
                      kind: worker
                      id: 63
                    type: entered
                    at: '2026-10-31T07:02:40Z'
                    zone_id: A
                    from_zone_id: null
                    reason: null
                  - event_id: 6fa459ea-ee8a-4ca4-894e-db77e160355e
                    site_id: 3
                    subject:
                      kind: worker
                      id: 63
                    type: moved_zone
                    at: '2026-10-31T07:10:05Z'
                    zone_id: B
                    from_zone_id: A
                    reason: null
                  - event_id: 0b8ae8a3-50d6-4d3c-a3f0-5b0d2b8c6c41
                    site_id: 3
                    subject:
                      kind: worker
                      id: 63
                    type: left
                    at: '2026-10-31T16:48:21Z'
                    zone_id: B
                    from_zone_id: null
                    reason: timeout
        required: true
      security:
      - TrackerService: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PresenceIngestResult'
              examples:
                Stored:
                  value:
                    stored: 3
                    duplicates: 0
                    ignored: 0
                    rejected: 0
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                TooManyEvents:
                  value:
                    code: validation_error
                    message: Invalid input.
                    details:
                      events:
                      - Ensure this field has no more than 500 elements.
                  summary: Too many events
          description: The request is invalid; `details` maps each field to its errors.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                NoToken:
                  value:
                    code: not_authenticated
                    message: Authentication credentials were not provided.
                    details: {}
                  summary: No token
                BadToken:
                  value:
                    code: not_authenticated
                    message: Invalid or expired tracker service token.
                    details: {}
                  summary: Bad token
          description: No service token, or one that is invalid, expired, not the
            tracker's or valid for more than 5 minutes.
  /api/v1/records/{record_id}/corrections/:
    post:
      operationId: record_correction
      description: |-
        For days that are `submitted` or `approved`. `reason` is required. Writes an AttendanceCorrection and an AuditLog entry; an approved day goes back to the site manager for review.

        201 when created; repeating the same `client_uuid` returns the original correction with 200 and `Idempotent-Replayed: true`. `client_uuid` reused for another record: `409 conflict`. Day still `draft`/`rejected` (use the batch PUT): `409 conflict`. Locked day: `423 locked`.

        The record id comes from a records/day response; an offline phone sends its corrections only after the outbox has stored the record ids.
      summary: Correct a record after submission
      parameters:
      - in: path
        name: record_id
        schema:
          type: integer
        required: true
      tags:
      - attendance
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CorrectionCreateRequest'
            examples:

                    details: {}
                  summary: not_authenticated
          description: Missing, invalid or revoked device token. Sign in again with
            the PIN.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                PermissionDenied:
                  value:

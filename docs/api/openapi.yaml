openapi: 3.0.3
info:
  title: Polaris Workforce API
  version: 1.0.0
  description: 'Foreman phone API: PIN sign-in, crew lists, roll call, corrections,
    sync and cash payouts. Authenticate with `Authorization: Device <token>` from
    `POST /api/v1/auth/pin/`. Errors are `{code, message, details}`. Every phone write
    carries a `client_uuid` and is idempotent. Money is an integer in the currency''s
    smallest unit, next to a `currency {code, decimals}` object. Dates are ISO 8601,
    times `HH:MM`. Conventions: docs/api/README.md.'
paths:
  /api/v1/auth/logout/:
    post:
      operationId: auth_logout
      description: 'Revokes the device token used for this call (sets `revoked_at`).
        Later calls with it get `401`. The phone should first drain its outbox: unsent
        writes cannot be sent after logout.'
      summary: Sign out this device
      tags:
      - accounts
      security:
      - DeviceToken: []
      - cookieAuth: []
      responses:
        '204':
          description: Signed out.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                NotAuthenticated:
                  value:
                    code: not_authenticated
                    message: Invalid or revoked device token.
                    details: {}
                  summary: not_authenticated
          description: Missing, invalid or revoked device token. Sign in again with
            the PIN.
  /api/v1/auth/pin/:
    post:
      operationId: auth_pin
      description: |-
        Exchanges phone + 4-digit PIN for a **device token**. No authentication; throttled per IP (`pin` scope, 10/minute).

        Signing in again from the same `device_id` revokes that device's previous token. After repeated wrong PINs the device is locked: `423 locked` with `details.locked_until`. A wrong PIN is `401 not_authenticated` with `details.attempts_left`.

        Keep the token in secure storage; it is shown only once.
      summary: Sign in with phone number and PIN
      tags:
      - accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PinLoginRequest'
            examples:
              SignIn:
                value:
                  phone: '+22890112233'
                  pin: '4821'
                  device_id: 0b6f4c4e-61a2-4d5b-9a50-8f3c0f5d2a11
                  device_name: Tecno Spark 10
                summary: Sign in
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PinLoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PinLoginRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PinLoginResponse'
              examples:
                SignedIn:
                  value:
                    token: q9V3rM2xQk7f0bU8p1sZcW4yL6tN5hJaDgE_oRiK-Yw
                    device:
                      id: 12
                      device_id: 0b6f4c4e-61a2-4d5b-9a50-8f3c0f5d2a11
                      name: Tecno Spark 10
                    user:
                      id: 7
                      name: Kossi Amegah
                      role: foreman
                      phone: '+22890112233'
                      language: fr
                    sites:
                    - id: 3
                      name: Riverside Apartments
                      address: Boulevard du Mono, Lomé
                      manager:
                        id: 4
                        name: Edem Kpodar
                      work_start: 07:00
                      roll_call_due: 08:00
                  summary: Signed in
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                ValidationError:
                  value:
                    code: validation_error
                    message: Invalid input.
                    details:
                      field_name:
                      - This field is required.
                  summary: validation_error
          description: The request is invalid; `details` maps each field to its errors.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                NotAuthenticated:
                  value:
                    code: not_authenticated
                    message: Invalid or revoked device token.
                    details: {}
                  summary: not_authenticated
          description: Missing, invalid or revoked device token. Sign in again with
            the PIN.
        '423':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                Locked:
                  value:
                    code: locked
                    message: This resource is locked and cannot be changed.
                    details:
                      status: locked
                  summary: locked
          description: 'Locked: the day or pay period is locked, or the device is
            locked after failed PINs.'
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                Throttled:
                  value:
                    code: throttled
                    message: Request was throttled. Expected available in 42 seconds.
                    details:
                      retry_after: 42
                  summary: throttled
          description: Too many requests. Wait `details.retry_after` seconds (also
            in `Retry-After`).
  /api/v1/health/:
    get:
      operationId: health
      description: 'Lets the phone check that the server is reachable before syncing.
        No authentication. Cheap: call it before draining the outbox.'
      summary: Server reachable
      tags:
      - system
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
              examples:
                Ok:
                  value:
                    status: ok
                  summary: ok
          description: ''
  /api/v1/me/:
    get:
      operationId: me
      description: Profile, company basics (time zone, currency) and the sites this
        user is assigned to. Call after sign-in and on every app start when online.
      summary: Signed-in foreman and assigned sites
      tags:
      - accounts
      security:
      - DeviceToken: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
              examples:
                Foreman:
                  value:
                    id: 7
                    name: Kossi Amegah
                    role: foreman
                    phone: '+22890112233'
                    language: fr
                    company:
                      country: TG
                      time_zone: Africa/Lome
                      currency:
                        code: XOF
                        decimals: 0
                    sites:
                    - id: 3
                      name: Riverside Apartments
                      address: Boulevard du Mono, Lomé
                      manager:
                        id: 4
                        name: Edem Kpodar
                      work_start: 07:00
                      roll_call_due: 08:00
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                NotAuthenticated:
                  value:
                    code: not_authenticated
                    message: Invalid or revoked device token.
                    details: {}
                  summary: not_authenticated
          description: Missing, invalid or revoked device token. Sign in again with
            the PIN.
  /api/v1/payments/:
    post:
      operationId: payment_create
      description: |-
        Records that a worker received their pay. Send `multipart/form-data` when there is a proof file, JSON otherwise.

        201 when created; repeating the same `client_uuid` returns the original payment with 200 and `Idempotent-Replayed: true` (send the file again on a retry; it is ignored on a replay). The line already paid under another `client_uuid`, or the sheet `not_open`: `409 conflict`. Sheet closed or period locked: `423 locked`.
      summary: Record a payment with proof
      tags:
      - payroll
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PaymentCreateRequest'
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentCreateRequest'
            examples:
              PayWithPhotoProof:
                value:
                  client_uuid: e4b1c9d2-6a3f-4d8e-b7c0-1a2b3c4d5e61
                  pay_line_id: 801
                  amount: 4000
                  proof_type: photo
                  paid_at: '2026-10-31T16:31:00Z'
                summary: Pay with photo proof
        required: true
      security:
      - DeviceToken: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
              examples:
                Paid:
                  value:
                    id: 3301
                    client_uuid: e4b1c9d2-6a3f-4d8e-b7c0-1a2b3c4d5e61
                    amount: 4000
                    proof_type: photo
                    paid_at: '2026-10-31T16:31:00Z'
                    pay_line_id: 801
                    currency:
                      code: XOF
                      decimals: 0
                    proof_url: https://polaris.example.com/media/proofs/3301.jpg
                    paid_by:
                      id: 7
                      name: Kossi Amegah
          description: ''
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
              examples:
                Paid:
                  value:
                    id: 3301
                    client_uuid: e4b1c9d2-6a3f-4d8e-b7c0-1a2b3c4d5e61
                    amount: 4000
                    proof_type: photo
                    paid_at: '2026-10-31T16:31:00Z'
                    pay_line_id: 801
                    currency:
                      code: XOF
                      decimals: 0
                    proof_url: https://polaris.example.com/media/proofs/3301.jpg
                    paid_by:
                      id: 7
                      name: Kossi Amegah
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                ValidationError:
                  value:
                    code: validation_error
                    message: Invalid input.
                    details:
                      field_name:
                      - This field is required.
                  summary: validation_error
          description: The request is invalid; `details` maps each field to its errors.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                NotAuthenticated:
                  value:
                    code: not_authenticated
                    message: Invalid or revoked device token.
                    details: {}
                  summary: not_authenticated
          description: Missing, invalid or revoked device token. Sign in again with
            the PIN.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                PermissionDenied:
                  value:
                    code: permission_denied
                    message: You do not have permission to perform this action.
                    details: {}
                  summary: permission_denied
          description: Signed in, but not allowed (for example a site you are not
            assigned to).
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                NotFound:
                  value:
                    code: not_found
                    message: Not found.
                    details: {}
                  summary: not_found
          description: The resource does not exist.
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                Conflict:
                  value:
                    code: conflict
                    message: This client_uuid was already used for a different request.
                    details:
                      client_uuid: 6f1c2b9e-1d1a-4c55-9a52-3f0e8a9d7b10
                  summary: conflict
          description: The request conflicts with the current state.
        '423':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                Locked:
                  value:
                    code: locked
                    message: This resource is locked and cannot be changed.
                    details:
                      status: locked
                  summary: locked
          description: 'Locked: the day or pay period is locked, or the device is
            locked after failed PINs.'
  /api/v1/records/{record_id}/corrections/:
    post:
      operationId: record_correction
      description: |-
        For days that are `submitted` or `approved`. `reason` is required. Writes an AttendanceCorrection and an AuditLog entry; an approved day goes back to the site manager for review.

        201 when created; repeating the same `client_uuid` returns the original correction with 200 and `Idempotent-Replayed: true`. `client_uuid` reused for another record: `409 conflict`. Day still `draft`/`rejected` (use the batch PUT): `409 conflict`. Locked day: `423 locked`.

        The record id comes from a records/day response; an offline phone sends its corrections only after the outbox has stored the record ids.
      summary: Correct a record after submission
      parameters:
      - in: path
        name: record_id
        schema:
          type: integer
        required: true
      tags:
      - attendance
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CorrectionCreateRequest'
            examples:
              CorrectArrival:
                value:
                  client_uuid: 5e9d0c4b-3a2f-4e1d-9b8c-7a6f5e4d3c21
                  field: arrival
                  new_value: 07:20
                  reason: Signed in at the gate at 07:20; marked late by mistake.
                summary: Correct arrival
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CorrectionCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CorrectionCreateRequest'
        required: true
      security:
      - DeviceToken: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Correction'
              examples:
                Created:
                  value:
                    id: 77
                    client_uuid: 5e9d0c4b-3a2f-4e1d-9b8c-7a6f5e4d3c21
                    record_id: 9003
                    field: arrival
                    old_value: 07:35
                    new_value: 07:20
                    reason: Signed in at the gate at 07:20; marked late by mistake.
                    created_by:
                      id: 7
                      name: Kossi Amegah
                    created_at: '2026-10-31T09:15:00Z'
                    record:
                      id: 9003
                      client_uuid: a1e5f9c3-2d4b-4f7e-8a06-b3c2d1e0f932
                      day_id: 210
                      worker_id: 63
                      status: late
                      arrival: 07:20
                      departure: null
                      note: ''
                      corrected: true
                      updated_at: '2026-10-31T07:41:12Z'
          description: ''
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Correction'
              examples:
                Created:
                  value:
                    id: 77
                    client_uuid: 5e9d0c4b-3a2f-4e1d-9b8c-7a6f5e4d3c21
                    record_id: 9003
                    field: arrival
                    old_value: 07:35
                    new_value: 07:20
                    reason: Signed in at the gate at 07:20; marked late by mistake.
                    created_by:
                      id: 7
                      name: Kossi Amegah
                    created_at: '2026-10-31T09:15:00Z'
                    record:
                      id: 9003
                      client_uuid: a1e5f9c3-2d4b-4f7e-8a06-b3c2d1e0f932
                      day_id: 210
                      worker_id: 63
                      status: late
                      arrival: 07:20
                      departure: null
                      note: ''
                      corrected: true
                      updated_at: '2026-10-31T07:41:12Z'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                ValidationError:
                  value:
                    code: validation_error
                    message: Invalid input.
                    details:
                      field_name:
                      - This field is required.
                  summary: validation_error
          description: The request is invalid; `details` maps each field to its errors.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                NotAuthenticated:
                  value:
                    code: not_authenticated
                    message: Invalid or revoked device token.
                    details: {}
                  summary: not_authenticated
          description: Missing, invalid or revoked device token. Sign in again with
            the PIN.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                PermissionDenied:
                  value:
                    code: permission_denied
                    message: You do not have permission to perform this action.
                    details: {}
                  summary: permission_denied
          description: Signed in, but not allowed (for example a site you are not
            assigned to).
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                NotFound:
                  value:
                    code: not_found
                    message: Not found.
                    details: {}
                  summary: not_found
          description: The resource does not exist.
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                Conflict:
                  value:
                    code: conflict
                    message: This client_uuid was already used for a different request.
                    details:
                      client_uuid: 6f1c2b9e-1d1a-4c55-9a52-3f0e8a9d7b10
                  summary: conflict
          description: The request conflicts with the current state.
        '423':

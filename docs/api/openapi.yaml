      summary: A payment's proof file
      parameters:
      - in: header
        name: If-None-Match
        schema:
          type: string
        description: The `ETag` of the copy the phone already has.
      - in: path
        name: payment_id
        schema:
          type: integer
        required: true
      tags:
      - files
      security:
      - DeviceToken: []
      - cookieAuth: []
      responses:
        '200':
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
            application/pdf:
              schema:
                type: string
                format: binary
          description: 'The file, with an `ETag`: send it back in `If-None-Match`
            to get `304 Not Modified` instead of the bytes.'
        '304':
          description: 'Not modified: the cached copy is current.'
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                NotAuthenticated:
                  value:
                    code: not_authenticated
                    message: Invalid or revoked device token.
                    details: {}
                  summary: not_authenticated
          description: Missing, invalid or revoked device token. Sign in again with
            the PIN.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                NotFound:
                  value:
                    code: not_found
                    message: Not found.
                    details: {}
                  summary: not_found
          description: The resource does not exist.

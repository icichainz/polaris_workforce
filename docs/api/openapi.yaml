        Who to pay and how much, with the cash reconciliation. Before the roll call is approved `status` is `not_open` and the figures are a preview ('Preview tonight's payout'). Every money value is an integer in the smallest unit of `currency`.

        Invariants: `total_to_pay = Σ net`, `left_to_pay = total_to_pay − paid_total`, `cash_in_hand = cash_issued − paid_total`.

        **`pay_line_id`** is stable for a worker and pay period while the line is recomputed (a correction, an approval): the line is updated in place. It changes only if the worker drops off the sheet (no worked day left in the period, e.g. corrected to absent) and comes back later, which makes a new line. A paid line is frozen. Pay from the latest sheet: a queued payment for a line that no longer exists gets `404 not_found`, and one whose `net` changed gets `400` on `amount`; fetch the sheet again.
      summary: Cash sheet for the day
      parameters:
      - in: path
        name: date
        schema:
          type: string
          format: date
        description: Work day, ISO 8601 `YYYY-MM-DD`, in the company time zone.
        required: true
      - in: path

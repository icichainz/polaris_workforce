            schema:
              $ref: '#/components/schemas/RecordBatchRequest'
            examples:
              Marks:
                value:
                  records:
                  - client_uuid: 3f2a7c1e-5b8d-4e0a-9c61-0d4b8e2f7a10
                    worker_id: 44
                    status: present
                    arrival: '07:00'

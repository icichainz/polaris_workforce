          description: Signed in, but not allowed (for example a site you are not
            assigned to).
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                NotFound:
                  value:
                    code: not_found
                    message: Not found.
                    details: {}
                  summary: not_found
          description: The resource does not exist.
  /api/v1/sites/{site_id}/days/{date}/:
    get:
      operationId: site_day
      description: 'Always 200 for a valid site and date: a day with no row on the
        server comes back with `id: null`, `status: not_started` and no records.'
      summary: The attendance day and its records
      parameters:
      - in: path
        name: date
        schema:
          type: string
          format: date
        description: Work day, ISO 8601 `YYYY-MM-DD`, in the company time zone.
        required: true
      - in: path
        name: site_id
        schema:
          type: integer
        description: A site the signed-in foreman is assigned to (from `GET /me/`).
        required: true
      tags:
      - attendance
      security:
      - DeviceToken: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttendanceDay'
              examples:
                Draft:
                  value:
                    id: 210
                    site_id: 3
                    date: '2026-10-31'
                    status: draft
                    foreman_note: ''
                    submitted_at: null
                    submitted_by: null
                    approved_at: null
                    approved_by: null
                    rejection_note: ''
                    counts:
                      expected: 42
                      present: 35
                      absent: 4

  /api/v1/health/:
    get:
      operationId: health
      description: 'Lets the phone check that the server is reachable before syncing.
        No authentication. Cheap: call it before draining the outbox.'
      summary: Server reachable
      tags:
      - system
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
              examples:
                Ok:
                  value:
                    status: ok
                  summary: ok
          description: ''

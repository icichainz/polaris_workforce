  /api/v1/sites/{site_id}/crew/:
    get:
      operationId: site_crew
      description: |-
        Every active worker assigned to the site on `date` (assignment start ≤ date ≤ end), sorted by last name, with the pay type in effect that day. The whole crew in one response (not paginated): the phone caches it, with the photos, for offline roll calls.

        `403 permission_denied` if the foreman is not assigned to the site.
      summary: Workers expected on a site that day
      parameters:
      - in: query
        name: date
        schema:
          type: string
          format: date
        description: 'Work day (YYYY-MM-DD). Default: today in the company time zone.'
      - in: path
        name: site_id
        schema:
          type: integer
        description: A site the signed-in foreman is assigned to (from `GET /me/`).
        required: true
      tags:
      - worksites
      security:
      - DeviceToken: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Crew'
              examples:
                Crew:
                  value:
                    site_id: 3
                    date: '2026-10-31'
                    count: 3
                    workers:
                    - id: 51
                      number: W-0142
                      first_name: Komlan
                      last_name: Agbeko
                      trade: Carpenter
                      photo_url: https://polaris.example.com/media/workers/W-0142.jpg
                      pay_type: daily
                      absent_streak: 0
                    - id: 58
                      number: W-0157
                      first_name: Kodjo
                      last_name: Atsu
                      trade: Labourer
                      photo_url: https://polaris.example.com/media/workers/W-0157.jpg
                      pay_type: daily
                      absent_streak: 2
                    - id: 44
                      number: W-0118
                      first_name: Yao
                      last_name: Mensah
                      trade: Mason
                      photo_url: https://polaris.example.com/media/workers/W-0118.jpg
                      pay_type: hourly
                      absent_streak: 0
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                ValidationError:
                  value:
                    code: validation_error
                    message: Invalid input.
                    details:
                      field_name:
                      - This field is required.
                  summary: validation_error
          description: The request is invalid; `details` maps each field to its errors.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                NotAuthenticated:
                  value:
                    code: not_authenticated
                    message: Invalid or revoked device token.
                    details: {}
                  summary: not_authenticated
          description: Missing, invalid or revoked device token. Sign in again with
            the PIN.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                PermissionDenied:
                  value:
                    code: permission_denied
                    message: You do not have permission to perform this action.
                    details: {}
                  summary: permission_denied
          description: Signed in, but not allowed (for example a site you are not
            assigned to).
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                NotFound:
                  value:
                    code: not_found

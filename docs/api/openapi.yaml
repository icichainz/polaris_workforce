components:
  schemas:
    AssignedSite:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        address:
          type: string
        manager:
          allOf:
          - $ref: '#/components/schemas/PersonRef'
          nullable: true
          description: Site manager who approves the roll call.
        work_start:
          type: string
          pattern: ^([01]\d|2[0-3]):[0-5]\d$
          example: 07:00
          description: 'Usual start of the work day: default arrival time.'
          nullable: true
        roll_call_due:
          type: string
          pattern: ^([01]\d|2[0-3]):[0-5]\d$
          example: 07:00
          description: Time by which the morning roll call should be submitted.
          nullable: true
      required:
      - address
      - id
      - manager
      - name
      - roll_call_due
      - work_start
    AttendanceDay:
      type: object
      properties:
        id:
          type: integer
          nullable: true
          description: Null while the day is `not_started` (no row on the server).
        site_id:
          type: integer
        date:
          type: string
          format: date
        status:
          $ref: '#/components/schemas/DayStatusEnum'
        foreman_note:
          type: string
        submitted_at:
          type: string
          format: date-time
          nullable: true
        submitted_by:
          allOf:
          - $ref: '#/components/schemas/PersonRef'
          nullable: true
        approved_at:
          type: string
          format: date-time
          nullable: true
        approved_by:
          allOf:
          - $ref: '#/components/schemas/PersonRef'
          nullable: true
        rejection_note:
          type: string
          description: Why the site manager sent the day back (status rejected).
        counts:
          $ref: '#/components/schemas/DayCounts'
        payout_status:
          allOf:
          - $ref: '#/components/schemas/PayoutStatusEnum'
          description: |-
            State of the day's cash payout.

            * `not_open` - Not open (waiting for approval)
            * `open` - Open
            * `paid` - Everyone paid
            * `closed` - Closed by the office
        updated_at:
          type: string
          format: date-time
          nullable: true
        records:
          type: array
          items:
            $ref: '#/components/schemas/AttendanceRecord'
      required:
      - approved_at
      - approved_by
      - counts
      - date
      - foreman_note
      - id
      - payout_status
      - records
      - rejection_note
      - site_id
      - status
      - submitted_at
      - submitted_by
      - updated_at
    AttendanceDayList:
      type: object
      properties:
        site_id:
          type: integer
        days:
          type: array
          items:
            $ref: '#/components/schemas/AttendanceDaySummary'
      required:
      - days
      - site_id
    AttendanceDaySummary:
      type: object
      properties:
        id:
          type: integer
          nullable: true
          description: Null while the day is `not_started` (no row on the server).
        site_id:
          type: integer
        date:
          type: string
          format: date
        status:
          $ref: '#/components/schemas/DayStatusEnum'
        foreman_note:
          type: string
        submitted_at:
          type: string
          format: date-time
          nullable: true
        submitted_by:
          allOf:
          - $ref: '#/components/schemas/PersonRef'
          nullable: true
        approved_at:
          type: string
          format: date-time
          nullable: true
        approved_by:
          allOf:
          - $ref: '#/components/schemas/PersonRef'
          nullable: true
        rejection_note:
          type: string
          description: Why the site manager sent the day back (status rejected).
        counts:
          $ref: '#/components/schemas/DayCounts'
        payout_status:
          allOf:
          - $ref: '#/components/schemas/PayoutStatusEnum'
          description: |-
            State of the day's cash payout.

            * `not_open` - Not open (waiting for approval)
            * `open` - Open
            * `paid` - Everyone paid
            * `closed` - Closed by the office
        updated_at:
          type: string
          format: date-time
          nullable: true
      required:
      - approved_at
      - approved_by
      - counts
      - date
      - foreman_note
      - id
      - payout_status
      - rejection_note
      - site_id
      - status
      - submitted_at
      - submitted_by
      - updated_at
    AttendanceRecord:
      type: object
      properties:
        id:
          type: integer
        client_uuid:
          type: string
          format: uuid
          description: The server's client_uuid for this record. The phone adopts
            it if it differs from its own (the same worker was marked from two phones).
        day_id:
          type: integer
        worker_id:
          type: integer
        status:
          $ref: '#/components/schemas/AttendanceStatusEnum'
        arrival:
          type: string
          pattern: ^([01]\d|2[0-3]):[0-5]\d$
          example: 07:00
          description: Local wall-clock time on the site, 24-hour `HH:MM`.
          nullable: true
        departure:
          type: string
          pattern: ^([01]\d|2[0-3]):[0-5]\d$
          example: 07:00
          description: Local wall-clock time on the site, 24-hour `HH:MM`.
          nullable: true
        note:
          type: string
        corrected:
          type: boolean
          description: True once a correction was applied after submission.
        updated_at:
          type: string
          format: date-time
      required:
      - arrival
      - client_uuid
      - corrected
      - day_id
      - departure
      - id
      - note
      - status
      - updated_at
      - worker_id
    AttendanceStatusEnum:
      enum:
      - present
      - absent
      - half_day
      - late
      type: string
      description: |-
        * `present` - Present
        * `absent` - Absent
        * `half_day` - Half day
        * `late` - Late
    Company:
      type: object
      properties:
        country:
          type: string
          description: ISO 3166-1 alpha-2, e.g. TG.
        time_zone:
          type: string
          description: IANA time zone, e.g. Africa/Lome. Decides which date is 'today'.
        currency:
          $ref: '#/components/schemas/Currency'
      required:
      - country
      - currency
      - time_zone
    CorrectableFieldEnum:
      enum:
      - status
      - arrival
      - departure
      - note
      type: string
      description: |-
        * `status` - Status
        * `arrival` - Arrival
        * `departure` - Departure
        * `note` - Note
    Correction:
      type: object
      properties:
        id:
          type: integer
        client_uuid:
          type: string
          format: uuid
        record_id:
          type: integer
        field:
          $ref: '#/components/schemas/CorrectableFieldEnum'
        old_value:
          type: string
          nullable: true
        new_value:
          type: string
          nullable: true
        reason:
          type: string
        created_by:
          $ref: '#/components/schemas/PersonRef'
        created_at:
          type: string
          format: date-time
        record:
          allOf:
          - $ref: '#/components/schemas/AttendanceRecord'
          description: The record after the correction.
      required:
      - client_uuid
      - created_at
      - created_by
      - field
      - id
      - new_value
      - old_value
      - reason
      - record
      - record_id
    CorrectionCreateRequest:
      type: object
      properties:
        client_uuid:
          type: string
          format: uuid
          description: Made on the phone when the user acts (UUID v4). Sending the
            same client_uuid again returns the original result instead of applying
            the write twice.
        field:
          $ref: '#/components/schemas/CorrectableFieldEnum'
        new_value:
          type: string
          nullable: true
          description: 'status: one of present/absent/half_day/late; arrival/departure:
            ''HH:MM'' or null; note: text.'
          maxLength: 500
        reason:
          type: string
          minLength: 1
          description: 'Required: why the record changes after submission.'
          maxLength: 500
      required:
      - client_uuid
      - field
      - new_value
      - reason
    Crew:
      type: object
      properties:
        site_id:
          type: integer
        date:
          type: string
          format: date
        count:
          type: integer
          description: Number of workers expected that day.
        workers:
          type: array
          items:
            $ref: '#/components/schemas/CrewWorker'
      required:
      - count
      - date
      - site_id
      - workers
    CrewWorker:
      type: object
      properties:
        id:
          type: integer
        number:
          type: string
          description: Worker number, e.g. W-0142.
        first_name:
          type: string
        last_name:
          type: string
        trade:
          type: string
          nullable: true
          description: Trade name, translated.
        photo_url:
          type: string
          format: uri
          nullable: true
          description: Absolute URL of the photo; cache it on the phone.
        pay_type:
          allOf:
          - $ref: '#/components/schemas/PayTypeEnum'
          description: |-
            Pay type of the rate in effect that day.

            * `daily` - Daily
            * `hourly` - Hourly
        absent_streak:
          type: integer
          minimum: 0
          description: 'Consecutive working days absent right before this date (review
            screen: ''Absent · 3rd day in a row'').'
      required:
      - absent_streak
      - first_name
      - id
      - last_name
      - number
      - pay_type
      - photo_url
      - trade
    Currency:
      type: object
      properties:
        code:
          type: string
          description: ISO 4217 code, e.g. XOF.
        decimals:
          type: integer
          maximum: 3
          minimum: 0
          description: Decimal places of the smallest unit. Display amount = value
            / 10**decimals.
      required:
      - code
      - decimals
    DayCounts:
      type: object
      properties:
        expected:
          type: integer
          description: Workers on the crew list that day.
        present:
          type: integer
        absent:
          type: integer
        half_day:
          type: integer
        late:
          type: integer
        unmarked:
          type: integer
          description: expected minus marked.
      required:
      - absent
      - expected
      - half_day
      - late
      - present
      - unmarked
    DayStatusEnum:
      enum:
      - not_started
      - draft
      - submitted
      - approved
      - rejected
      - locked
      type: string
      description: |-
        * `not_started` - Not started
        * `draft` - Draft
        * `submitted` - Submitted
        * `approved` - Approved
        * `rejected` - Rejected
        * `locked` - Locked
    Device:
      type: object
      properties:
        id:
          type: integer
        device_id:
          type: string
        name:
          type: string
      required:
      - device_id
      - id
      - name
    Error:
      type: object
      properties:
        code:
          allOf:
          - $ref: '#/components/schemas/ErrorCodeEnum'
          description: |-
            Stable machine-readable code. Branch on this.

            * `not_authenticated` - Missing, invalid or revoked credentials.
            * `permission_denied` - Authenticated, but not allowed (for example another site).
            * `not_found` - The resource does not exist.
            * `validation_error` - The request body or query string is invalid.
            * `throttled` - Too many requests; retry later.
            * `conflict` - The request conflicts with the current state.
            * `locked` - The resource is locked (a locked day or pay period, or a locked device).
            * `not_implemented` - The endpoint is part of the contract but not built yet.
            * `method_not_allowed` - The HTTP method is not allowed on this path.
            * `unsupported_media_type` - The request content type is not supported.
            * `not_acceptable` - The Accept header cannot be satisfied.
            * `server_error` - Unexpected server error.
        message:
          type: string
          description: Human-readable, translated (Accept-Language).
        details:
          type: object
          additionalProperties: {}
          description: 'Always an object. validation_error: field → list of messages
            (nested for lists, e.g. `records[2].status`); throttled: `retry_after`
            seconds; others: context.'
      required:
      - code
      - details
      - message
    ErrorCodeEnum:
      enum:
      - not_authenticated
      - permission_denied
      - not_found
      - validation_error
      - throttled
      - conflict
      - locked
      - not_implemented
      - method_not_allowed
      - unsupported_media_type
      - not_acceptable
      - server_error
      type: string
      description: |-
        * `not_authenticated` - Missing, invalid or revoked credentials.
        * `permission_denied` - Authenticated, but not allowed (for example another site).
        * `not_found` - The resource does not exist.
        * `validation_error` - The request body or query string is invalid.
        * `throttled` - Too many requests; retry later.
        * `conflict` - The request conflicts with the current state.
        * `locked` - The resource is locked (a locked day or pay period, or a locked device).
        * `not_implemented` - The endpoint is part of the contract but not built yet.
        * `method_not_allowed` - The HTTP method is not allowed on this path.
        * `unsupported_media_type` - The request content type is not supported.
        * `not_acceptable` - The Accept header cannot be satisfied.
        * `server_error` - Unexpected server error.
    Health:
      type: object
      properties:
        status:
          type: string
      required:
      - status
    LanguageEnum:
      enum:
      - en
      - fr
      type: string
      description: |-
        * `en` - English
        * `fr` - French
    Me:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
          description: Full name; the app derives initials from it.
        role:
          $ref: '#/components/schemas/UserRoleEnum'
        phone:
          type: string
        language:
          allOf:
          - $ref: '#/components/schemas/LanguageEnum'
          description: |-
            UI language for this user (falls back to company).

            * `en` - English
            * `fr` - French
        company:
          $ref: '#/components/schemas/Company'
        sites:
          type: array
          items:
            $ref: '#/components/schemas/AssignedSite'
      required:
      - company
      - id
      - language
      - name
      - phone
      - role
      - sites
    PayTypeEnum:
      enum:
      - daily
      - hourly
      type: string
      description: |-
        * `daily` - Daily
        * `hourly` - Hourly
    Payment:
      type: object
      properties:
        id:
          type: integer
        client_uuid:
          type: string
          format: uuid
        pay_line_id:
          type: integer
        amount:
          type: integer
          format: int64
          description: 'Money: an integer in the currency''s smallest unit (see the
            `currency` object of the same response). 5000 XOF (0 decimals) is 5000;
            12.50 EUR is 1250.'
        currency:
          $ref: '#/components/schemas/Currency'
        proof_type:
          $ref: '#/components/schemas/ProofTypeEnum'
        proof_url:
          type: string
          format: uri
          nullable: true
        paid_at:
          type: string
          format: date-time
        paid_by:
          $ref: '#/components/schemas/PersonRef'
      required:
      - amount
      - client_uuid
      - currency
      - id
      - paid_at
      - paid_by
      - pay_line_id
      - proof_type
      - proof_url
    PaymentCreateRequest:
      type: object
      properties:
        client_uuid:
          type: string
          format: uuid
          description: Made on the phone when the user acts (UUID v4). Sending the
            same client_uuid again returns the original result instead of applying
            the write twice.
        pay_line_id:
          type: integer
        amount:
          type: integer
          format: int64
          description: Smallest unit. Normally the line's `net`.
          minimum: 0
        proof_type:
          $ref: '#/components/schemas/ProofTypeEnum'
        proof_file:
          type: string
          format: binary
          nullable: true
          description: JPEG/PNG of the photo, signature or thumb mark (compress on
            the phone; ≤ 2 MB). Whether it is required depends on the company's proof
            setting.
        paid_at:
          type: string
          format: date-time
          description: 'When the cash was handed over, from the phone clock (offline
            payments are sent later). Default: the time the server receives it.'
      required:
      - amount
      - client_uuid
      - pay_line_id
      - proof_type
    PaymentSummary:
      type: object
      properties:
        id:
          type: integer
        client_uuid:
          type: string
          format: uuid
        amount:
          type: integer
          format: int64
          description: 'Money: an integer in the currency''s smallest unit (see the
            `currency` object of the same response). 5000 XOF (0 decimals) is 5000;
            12.50 EUR is 1250.'
        proof_type:
          $ref: '#/components/schemas/ProofTypeEnum'
        paid_at:
          type: string
          format: date-time
      required:
      - amount
      - client_uuid
      - id
      - paid_at
      - proof_type
    Payout:
      type: object
      properties:
        site_id:
          type: integer
        date:
          type: string
          format: date
        status:
          allOf:
          - $ref: '#/components/schemas/PayoutStatusEnum'
          description: |-
            `not_open`: the roll call is not approved yet; figures are a preview and payments are refused (409).

            * `not_open` - Not open (waiting for approval)
            * `open` - Open
            * `paid` - Everyone paid
            * `closed` - Closed by the office
        day_status:
          $ref: '#/components/schemas/DayStatusEnum'
        approved_at:
          type: string
          format: date-time
          nullable: true
        currency:
          $ref: '#/components/schemas/Currency'
        cash_issued:
          type: integer
          format: int64
          description: Cash handed to the foreman for this sheet.
        total_to_pay:
          type: integer
          format: int64
          description: Sum of `net` over all lines.
        paid_total:
          type: integer
          format: int64
          description: Sum of payments made.
        left_to_pay:
          type: integer
          format: int64
          description: total_to_pay − paid_total.
        cash_in_hand:
          type: integer
          format: int64
          description: 'cash_issued − paid_total: what the foreman should hold now
            (and return to the office once everyone is paid).'
        line_count:
          type: integer
        paid_count:
          type: integer
        lines:
          type: array
          items:
            $ref: '#/components/schemas/PayoutLine'
      required:
      - approved_at
      - cash_in_hand
      - cash_issued
      - currency
      - date
      - day_status
      - left_to_pay
      - line_count
      - lines
      - paid_count
      - paid_total
      - site_id
      - status
      - total_to_pay
    PayoutLine:
      type: object
      properties:
        pay_line_id:
          type: integer
          description: Send this to `POST /payments/`.
        worker:
          $ref: '#/components/schemas/PayoutWorker'
        worked:
          type: string
          description: Translated label of what was worked, e.g. '1 day', '½ day',
            '1 day · late'.
        units:
          type: string
          format: decimal
          pattern: ^-?\d{0,4}(?:\.\d{0,2})?$
          description: Units paid (days or hours, by pay type), as a decimal string.
        gross:
          type: integer
          format: int64
          description: Earned for the day.
        advance_deduction:
          type: integer
          format: int64
          description: Advance repayment taken from this pay (0 if none).
        net:
          type: integer
          format: int64
          description: 'Hand over: gross − advance_deduction.'
        payment:
          allOf:
          - $ref: '#/components/schemas/PaymentSummary'
          nullable: true
          description: Null until paid.
      required:
      - advance_deduction
      - gross
      - net
      - pay_line_id
      - payment
      - units
      - worked
      - worker
    PayoutStatusEnum:
      enum:
      - not_open
      - open
      - paid
      - closed
      type: string
      description: |-
        * `not_open` - Not open (waiting for approval)
        * `open` - Open
        * `paid` - Everyone paid
        * `closed` - Closed by the office
    PayoutWorker:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        trade:
          type: string
          nullable: true
        photo_url:
          type: string
          format: uri
          nullable: true
      required:
      - id
      - name
      - photo_url
      - trade
    PersonRef:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
      required:
      - id
      - name
    PinLoginRequest:
      type: object
      properties:
        phone:
          type: string
          minLength: 1
          description: The foreman's phone number, as entered on the User record.
          maxLength: 32
        pin:
          type: string
          writeOnly: true
          minLength: 1
          description: The 4-digit PIN.
          maxLength: 4
          pattern: ^\d{4}$
        device_id:
          type: string
          minLength: 1
          description: Stable install ID made by the app on first launch (UUID). One
            token per device.
          maxLength: 128
        device_name:
          type: string
          description: e.g. 'Tecno Spark 10'.
          maxLength: 100
      required:
      - device_id
      - phone
      - pin
    PinLoginResponse:
      type: object
      properties:
        token:
          type: string
          description: 'Device token. Shown once; keep it in secure storage. Send
            it as `Authorization: Device <token>`.'
        device:
          $ref: '#/components/schemas/Device'
        user:
          $ref: '#/components/schemas/UserProfile'
        sites:
          type: array
          items:
            $ref: '#/components/schemas/AssignedSite'
      required:
      - device
      - sites
      - token
      - user
    ProofTypeEnum:
      enum:
      - photo
      - signature
      - thumb_mark
      - none
      type: string
      description: |-
        * `photo` - Photo
        * `signature` - Signature
        * `thumb_mark` - Thumb mark
        * `none` - No proof
    RecordBatchRequest:
      type: object
      properties:
        records:
          type: array
          items:
            $ref: '#/components/schemas/RecordUpsertRequest'
      required:
      - records
    RecordUpsertRequest:
      type: object
      properties:
        client_uuid:
          type: string
          format: uuid
          description: One per worker per day, made on the phone the first time the
            worker is marked; reuse it for every later change of that record.
        worker_id:
          type: integer
        status:
          $ref: '#/components/schemas/AttendanceStatusEnum'
        arrival:
          type: string
          pattern: ^([01]\d|2[0-3]):[0-5]\d$
          example: 07:00
          description: Local wall-clock time on the site, 24-hour `HH:MM`.
          nullable: true
        departure:
          type: string
          pattern: ^([01]\d|2[0-3]):[0-5]\d$
          example: 07:00
          description: Local wall-clock time on the site, 24-hour `HH:MM`.
          nullable: true
        note:
          type: string
          default: ''
          maxLength: 500
      required:
      - client_uuid
      - status
      - worker_id
    SubmitDayRequest:
      type: object
      properties:
        client_uuid:
          type: string
          format: uuid
          description: Made on the phone when the user acts (UUID v4). Sending the
            same client_uuid again returns the original result instead of applying
            the write twice.
        foreman_note:
          type: string
          default: ''
          description: Optional note for the site manager.
          maxLength: 1000
      required:
      - client_uuid
    Sync:
      type: object
      properties:
        server_time:
          type: string
          format: date-time
          description: Store it and send it as `since` next time. Taken before reading
            changes, so nothing is missed (an item may come twice; apply as upserts
            by id).
        since:
          type: string
          format: date-time
          nullable: true
        days:
          type: array
          items:
            $ref: '#/components/schemas/AttendanceDaySummary'
        records:
          type: array
          items:
            $ref: '#/components/schemas/AttendanceRecord'
        corrections:
          type: array
          items:
            $ref: '#/components/schemas/Correction'
      required:
      - corrections
      - days
      - records
      - server_time
      - since
    UserProfile:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
          description: Full name; the app derives initials from it.
        role:
          $ref: '#/components/schemas/UserRoleEnum'
        phone:
          type: string
        language:
          allOf:
          - $ref: '#/components/schemas/LanguageEnum'
          description: |-
            UI language for this user (falls back to company).

            * `en` - English
            * `fr` - French
      required:
      - id
      - language
      - name
      - phone
      - role
    UserRoleEnum:
      enum:
      - admin
      - site_manager
      - foreman
      - accountant
      type: string
      description: |-
        * `admin` - Admin
        * `site_manager` - Site manager
        * `foreman` - Foreman
        * `accountant` - Accountant
  securitySchemes:
    DeviceToken:
      type: apiKey
      in: header
      name: Authorization
      description: 'Device token from `POST /api/v1/auth/pin/`, sent as `Authorization:
        Device <token>`.'
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
tags:
- name: system
  description: Reachability.
- name: accounts
  description: 'PIN sign-in, sign-out, profile (Wave 2: A).'
- name: worksites
  description: 'Crew lists (Wave 2: B).'
- name: attendance
  description: 'Roll call, corrections, sync (Wave 2: C).'
- name: payroll
  description: 'Cash payout and payments (Wave 2: D).'

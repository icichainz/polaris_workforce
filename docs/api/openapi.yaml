    CheckInCreateRequest:
      type: object
      properties:
        client_uuid:
          type: string
          format: uuid
          description: Made on the phone when the user acts (UUID v4). Sending the
            same client_uuid again returns the original result instead of applying
            the write twice.
        site_id:
          type: integer
          description: A site from `GET /me/`.
        direction:
          $ref: '#/components/schemas/DirectionEnum'
        at:
          type: string
          format: date-time
          description: Phone clock when the badge was scanned (ISO 8601 with offset).
            At most 10 minutes ahead of the server and 31 days old. Decides the work
            day.
        badge:
          type: string
          nullable: true
          minLength: 1
          description: The scanned QR text exactly as read, e.g. `PW1:K7Q2M4XR5TBN3WCA.D6HZP2LQ4V7NYE3S`
            (the `PW1:` prefix may be left out). Send this **or** `worker_id`. Kiosk
            phones must send `badge`.
          maxLength: 200
        worker_id:
          type: integer
          nullable: true
          description: 'Manual check-in: a worker picked by the foreman (no badge).
            Send this **or** `badge`.'
        latitude:
          type: number
          format: double
          maximum: 90
          minimum: -90
          nullable: true
          description: GPS latitude in decimal degrees (WGS 84), 6 decimals.
        longitude:
          type: number
          format: double
          maximum: 180
          minimum: -180
          nullable: true
          description: GPS longitude in decimal degrees (WGS 84), 6 decimals.
        accuracy_m:
          type: integer
          maximum: 100000
          minimum: 0
          nullable: true
          description: GPS accuracy radius in metres, as the phone reports it.
        photo:
          type: string
          format: binary
          nullable: true
          description: 'Optional photo of the worker at the scan: jpg, jpeg, png or
            webp, at most 5 MB (aim for ≤ 1280 px, a few hundred KB). Send `multipart/form-data`
            with a photo, JSON otherwise.'
          pattern: (?:jpg|jpeg|png|webp)$
      required:
      - at
      - client_uuid
      - direction
      - site_id
    CheckInDevice:
      type: object
      properties:
        attendance_mode:
          $ref: '#/components/schemas/AttendanceModeEnum'
        kiosk:
          allOf:
          - $ref: '#/components/schemas/Kiosk'
          nullable: true
      required:
      - attendance_mode
      - kiosk
    CheckInList:
      type: object
      properties:

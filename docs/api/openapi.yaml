  /api/v1/office/days/{day_id}/decision-preview/:
    post:
      operationId: office_day_decision_preview
      description: Step 1 of 2. Checks that the decision can be taken and returns
        the day as it will be decided, plus a `confirmation`. Nothing changes. Show
        the preview to the person and send the confirmation only once they agree.
        `reject` sends the day back to the foreman and needs a `note`. The confirmation
        expires after 10 minutes.
      summary: Preview approving or sending back a roll call
      parameters:
      - in: path
        name: day_id
        schema:
          type: integer
        description: Attendance day id.
        required: true
      tags:
      - office
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DecisionPreviewRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DecisionPreviewRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DecisionPreviewRequestRequest'
        required: true
      security:
      - AgentToken: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DecisionPreview'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                ValidationError:
                  value:
                    code: validation_error
                    message: Invalid input.
                    details:
                      client_uuid:
                      - This field is required.
                  summary: validation_error
          description: The request is invalid; `details` maps each field to its errors.
        '401':
          content:
            application/json:

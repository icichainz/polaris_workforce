  /api/v1/sites/{site_id}/days/{date}/records/:
    put:
      operationId: site_day_records
      description: |-
        Creates the day (status `draft`) if needed and upserts every record in the batch (at most 200). Records not in the batch are left alone.

        **Idempotent per record.** The server finds each record by `client_uuid`, then by `worker_id` (one record per worker per day), and writes only fields that changed; replaying a batch changes nothing. The response carries the server's `client_uuid` per worker: adopt it.

        Allowed while the day is `not_started`, `draft` or `rejected` (a rejected day goes back to `draft`). Once `submitted`, `approved` or `locked`: `423 locked` — use corrections. A worker not on the crew that day: `400 validation_error`.
      summary: Save roll-call marks (batch upsert)
      parameters:
      - in: path
        name: date
        schema:
          type: string
          format: date
        description: Work day, ISO 8601 `YYYY-MM-DD`, in the company time zone.
        required: true
      - in: path
        name: site_id
        schema:
          type: integer
        description: A site the signed-in foreman is assigned to (from `GET /me/`).
        required: true
      tags:

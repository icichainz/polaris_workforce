  /api/v1/sites/{site_id}/days/{date}/suggestions/:
    get:
      operationId: site_day_suggestions
      description: |-
        One suggestion per crew worker with counted check-ins or a presence (workers with neither are not listed: no suggestion), by worker id. `sources` says which (1.5).

        **Check-ins** (company time zone): `arrival` = first `in`, `departure` = last `out`; an `in` and an `out` before 12:00, or an `in` at or after 12:00 → `half_day`; first `in` after `late_after` → `late`; else `present`. Only an `out` → `status: null`.

        **Presence** (1.5), only where `tracking_enabled` resolves on for the site and the worker: `presence` = `{first_seen_at, last_seen_at (null while still on site), open, seen_from, seen_until, zones, visits, status}`. Its `status`: time on site inside working hours (`work_start`–`work_end`; an open session counts until `work_end`) less than `half_day_units` of those hours → `half_day`; else first sighting after `late_after` → `late`; else `present`.

        **Both:** the check-ins win — `status`, `arrival`, `departure`, `first_in_at`, `last_out_at` and `checkin_count` mean what they meant in 1.4 — and `presence` is shown next to them. **Presence only:** `status`, `arrival` (`seen_from`) and `departure` (`seen_until`) come from the presence, the check-in fields are `null`/`0`.

        The phone pre-fills the roll call with check-in suggestions (modes `both` and `self_check_in`). Presence never marks attendance: the phone shows "seen 07:12–16:48, zone B" and the foreman accepts it, which goes through `PUT .../records/` with `from_suggestion: [presence]` (audited). `day_status` says whether the day can still change.
      summary: Roll-call suggestions from check-ins and presence
      parameters:
      - in: path
        name: date
        schema:
          type: string
          format: date
        description: Work day, ISO 8601 `YYYY-MM-DD`, in the company time zone.
        required: true
      - in: path
        name: site_id
        schema:
          type: integer
        description: A site the signed-in foreman is assigned to (from `GET /me/`).
        required: true
      tags:
      - checkin
      security:
      - DeviceToken: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RollCallSuggestions'
              examples:
                Suggestions:
                  value:
                    site_id: 3
                    date: '2026-10-31'
                    attendance_mode: both
                    late_after: '07:15'
                    day_status: not_started
                    suggestions:
                    - worker_id: 44
                      status: half_day
                      arrival: '07:05'
                      departure: '11:30'
                      first_in_at: '2026-10-31T07:05:02Z'
                      last_out_at: '2026-10-31T11:30:00Z'
                      checkin_count: 2
                      sources:
                      - checkin
                      presence: null
                    - worker_id: 51
                      status: present
                      arrival: '07:02'
                      departure: null
                      first_in_at: '2026-10-31T07:02:40Z'
                      last_out_at: null
                      checkin_count: 1
                      sources:
                      - checkin
                      presence: null
                    - worker_id: 58
                      status: late
                      arrival: '07:31'
                      departure: null
                      first_in_at: null
                      last_out_at: null
                      checkin_count: 0
                      sources:
                      - presence
                      presence:
                        first_seen_at: '2026-10-31T07:31:10Z'
                        last_seen_at: null
                        open: true
                        seen_from: '07:31'
                        seen_until: null
                        zones:
                        - A
                        visits: 2
                        status: late
                    - worker_id: 63
                      status: late
                      arrival: '07:35'
                      departure: null
                      first_in_at: '2026-10-31T07:35:10Z'
                      last_out_at: null
                      checkin_count: 1
                      sources:
                      - checkin
                      - presence
                      presence:
                        first_seen_at: '2026-10-31T07:02:40Z'
                        last_seen_at: '2026-10-31T16:48:21Z'
                        open: false
                        seen_from: '07:02'
                        seen_until: '16:48'
                        zones:

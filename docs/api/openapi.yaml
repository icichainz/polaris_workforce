openapi: 3.0.3
info:
  title: Polaris Workforce API
  version: 1.5.0
  description: |-
    Foreman phone API: PIN sign-in, crew lists, roll call, corrections, sync and cash payouts. Authenticate with `Authorization: Device <token>` from `POST /api/v1/auth/pin/`. Errors are `{code, message, details}`. Every phone write carries a `client_uuid` and is idempotent. Money is an integer in the currency's smallest unit, next to a `currency {code, decimals}` object. Dates are ISO 8601, times `HH:MM`. Conventions: docs/api/README.md.

    The `office` endpoints serve AI assistants (the Polaris MCP server) and only accept an agent token: `Authorization: Bearer pol_…`.
paths:
  /api/v1/auth/logout/:
    post:
      operationId: auth_logout
      description: |-
        Revokes the device token used for this call (sets `revoked_at`). Later calls with it get `401`.

        **The outbox survives a logout.** Records, submissions, corrections and payments belong to the user and the site, not to the token: writes queued before the logout are accepted once the same user signs in again on the device (new token), and replays of writes already sent still return the original result. Try to drain the outbox first anyway; keep what is left and send it after the next sign-in of the same user. Another user signed in on the phone cannot replay a payment (`409 conflict`), so don't hand a foreman's outbox to someone else.
      summary: Sign out this device
      tags:
      - accounts
      security:
      - DeviceToken: []
      - cookieAuth: []
      responses:
        '204':
          description: Signed out.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                NotAuthenticated:
                  value:
                    code: not_authenticated
                    message: Invalid or revoked device token.
                    details: {}
                  summary: not_authenticated
          description: Missing, invalid or revoked device token. Sign in again with
            the PIN.
  /api/v1/auth/pin/:
    post:
      operationId: auth_pin
      description: |-
        Exchanges phone + 4-digit PIN for a **device token**. No authentication; throttled per IP (`pin` scope, 10/minute).

        Signing in again from the same `device_id` replaces that device's previous token. Signing in again after a logout gives a new token for the same user: writes queued in the outbox before the logout are accepted with it.

        Errors:
        - A wrong PIN for a foreman (or admin) who has one: `401 not_authenticated` with `details.attempts_left` (tries left before the lock; the 5th wrong PIN answers `attempts_left: 0` plus `details.locked_until`).
        - An unknown phone number, a user without a PIN, a disabled user, or a role that cannot use the phone (site manager, accountant): the same plain `401 not_authenticated` with empty `details`. The answer does not say which.
        - While locked after 5 wrong PINs (15 minutes), even with the right PIN: `423 locked` with `details.locked_until` (ISO datetime).

        Keep the token in secure storage; it is shown only once.
      summary: Sign in with phone number and PIN
      tags:
      - accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PinLoginRequest'
            examples:
              SignIn:
                value:
                  phone: '+22890112233'
                  pin: '4821'
                  device_id: 0b6f4c4e-61a2-4d5b-9a50-8f3c0f5d2a11
                  device_name: Tecno Spark 10
                summary: Sign in
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PinLoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PinLoginRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PinLoginResponse'
              examples:
                SignedIn:
                  value:
                    token: q9V3rM2xQk7f0bU8p1sZcW4yL6tN5hJaDgE_oRiK-Yw
                    device:
                      id: 12
                      device_id: 0b6f4c4e-61a2-4d5b-9a50-8f3c0f5d2a11
                      name: Tecno Spark 10
                    user:
                      id: 7
                      name: Kossi Amegah
                      role: foreman
                      phone: '+22890112233'
                      language: fr
                    sites:
                    - id: 3
                      name: Riverside Apartments
                      address: Boulevard du Mono, Lomé
                      manager:
                        id: 4
                        name: Edem Kpodar
                      work_start: '07:00'
                      roll_call_due: '08:00'
                  summary: Signed in
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                BadPINFormat:
                  value:
                    code: validation_error
                    message: Invalid input.
                    details:
                      pin:
                      - This value does not match the required pattern.
                  summary: Bad PIN format
          description: The request is invalid; `details` maps each field to its errors.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                WrongPIN:
                  value:
                    code: not_authenticated
                    message: Wrong PIN.
                    details:
                      attempts_left: 2
                  summary: Wrong PIN
                UnknownPhoneOrNoPIN:
                  value:
                    code: not_authenticated
                    message: Wrong phone number or PIN.
                    details: {}
                  summary: Unknown phone or no PIN
          description: Wrong PIN (`details.attempts_left`), or an unknown phone /
            no PIN / a role that cannot sign in on the phone (empty `details`).
        '423':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                LockedAfterWrongPINs:
                  value:
                    code: locked
                    message: Too many wrong PINs. Try again later.
                    details:
                      locked_until: '2026-10-31T06:57:00Z'
                  summary: Locked after wrong PINs
          description: 'Locked after 5 wrong PINs: `details.locked_until` (ISO datetime).'
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                Throttled:
                  value:
                    code: throttled
                    message: Request was throttled. Expected available in 42 seconds.
                    details:
                      retry_after: 42
                  summary: throttled
          description: Too many requests. Wait `details.retry_after` seconds (also
            in `Retry-After`).
  /api/v1/checkin/device/:
    get:
      operationId: checkin_device
      description: 'Call after sign-in and with `GET /me/`. `kiosk` is set when the
        office has switched this phone to kiosk mode: show only the kiosk screen for
        that site (the token may then only record check-ins there). `null`: an ordinary
        foreman phone. A browser session has no device: `kiosk` is `null`.'
      summary: This phone's check-in role
      tags:
      - checkin
      security:
      - DeviceToken: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckInDevice'
              examples:
                KioskPhone:
                  value:
                    attendance_mode: both
                    kiosk:
                      site_id: 3
                      site_name: Riverside Apartments
                      since: '2026-10-30T06:30:00Z'
                  summary: Kiosk phone
                ForemanPhone:
                  value:
                    attendance_mode: both
                    kiosk: null
                  summary: Foreman phone
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                NotAuthenticated:
                  value:
                    code: not_authenticated
                    message: Invalid or revoked device token.
                    details: {}
                  summary: not_authenticated
          description: Missing, invalid or revoked device token. Sign in again with
            the PIN.
  /api/v1/checkins/:
    post:
      operationId: checkin_create
      description: |-
        A badge scanned by the foreman's phone or a kiosk phone (`badge`: the QR text as read), or a worker picked by hand (`worker_id`, not on a kiosk). Optional GPS (`latitude`, `longitude`, `accuracy_m`) is checked against the site's geofence; an optional `photo` (multipart) is kept for the office.

        **Always recorded, never refused for what it says:** an unknown or revoked badge, a worker not on the crew, or a position outside the geofence still answers `201`, with `counted` and `flags` telling the phone what to show (e.g. `unknown_badge` → "Badge not recognised, see the foreman"). Only `counted: true` check-ins feed the roll-call suggestions.

        Attendance mode `self_check_in`: a counted check-in of a crew worker also writes that worker's record on the day's **draft** (`draft_updated: true`), never once the day was submitted. Marks the foreman changed by hand are not overwritten.

        Idempotent: `201` when created; the same `client_uuid` again returns the original check-in with `200` and `Idempotent-Replayed: true` (a photo sent again is ignored). The same `client_uuid` for a different check-in: `409 conflict`.

        Errors, in the order they are checked: no or bad token `401`; not a foreman (or a kiosk phone calling another endpoint) `403`; the body (`at` more than 10 minutes ahead or 31 days old, both or neither of `badge`/`worker_id`, coordinates, a bad photo) `400`; the site (one you are not on, or a kiosk phone sending for another site) `403`; `worker_id` not a worker of the company `400`; a kiosk sending `worker_id` `400`; the `client_uuid` used for another check-in `409`.
      summary: Record a check-in or check-out
      tags:
      - checkin
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CheckInCreateRequest'
          application/json:
            schema:
              $ref: '#/components/schemas/CheckInCreateRequest'
            examples:
              BadgeScanWithGPS:
                value:
                  client_uuid: 9d5e1f7a-3b2c-4e8d-a1f0-6c7b8a9d0e12
                  site_id: 3
                  direction: in
                  at: '2026-10-31T07:35:10Z'
                  badge: PW1:K7Q2M4XR5TBN3WCA.D6HZP2LQ4V7NYE3S
                  latitude: 6.132101
                  longitude: 1.223012
                  accuracy_m: 12
                summary: Badge scan with GPS
              ManualCheck-out:
                value:
                  client_uuid: 1a2b3c4d-5e6f-4a1b-8c2d-3e4f5a6b7c81
                  site_id: 3
                  direction: out
                  at: '2026-10-31T11:30:00Z'
                  worker_id: 44
                summary: Manual check-out
        required: true
      security:
      - DeviceToken: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckIn'
              examples:
                Recorded:
                  value:
                    id: 5121
                    client_uuid: 9d5e1f7a-3b2c-4e8d-a1f0-6c7b8a9d0e12
                    site_id: 3
                    worker_id: 63
                    date: '2026-10-31'
                    direction: in
                    at: '2026-10-31T07:35:10Z'
                    received_at: '2026-10-31T07:35:12Z'
                    source: foreman_scan
                    latitude: 6.132101
                    longitude: 1.223012
                    accuracy_m: 12
                    distance_m: 32
                    inside_geofence: true
                    counted: true
                    draft_updated: false
                    flags: []
                    photo_url: null
                UnknownBadge,OutsideTheGeofence:
                  value:
                    id: 5119
                    client_uuid: 2c4e6a8b-1d3f-4b5c-9e7a-0f1e2d3c4b02
                    site_id: 3
                    worker_id: null
                    date: '2026-10-31'
                    direction: in
                    at: '2026-10-31T07:03:15Z'
                    received_at: '2026-10-31T07:03:16Z'
                    source: foreman_scan
                    latitude: 6.141002
                    longitude: 1.230113
                    accuracy_m: 20
                    distance_m: 1305
                    inside_geofence: false
                    counted: false
                    draft_updated: false
                    flags:
                    - unknown_badge
                    - outside_geofence
                    photo_url: null
                  summary: Unknown badge, outside the geofence
          description: ''
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckIn'
              examples:
                Recorded:
                  value:
                    id: 5121
                    client_uuid: 9d5e1f7a-3b2c-4e8d-a1f0-6c7b8a9d0e12
                    site_id: 3
                    worker_id: 63
                    date: '2026-10-31'
                    direction: in
                    at: '2026-10-31T07:35:10Z'
                    received_at: '2026-10-31T07:35:12Z'
                    source: foreman_scan
                    latitude: 6.132101
                    longitude: 1.223012
                    accuracy_m: 12
                    distance_m: 32
                    inside_geofence: true
                    counted: true
                    draft_updated: false
                    flags: []
                    photo_url: null
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                BadgeAndWorkerId:
                  value:
                    code: validation_error
                    message: Invalid input.
                    details:
                      non_field_errors:
                      - Send either badge or worker_id.
                  summary: Badge and worker_id
                PhoneClockAhead:
                  value:
                    code: validation_error
                    message: Invalid input.
                    details:
                      at:
                      - This time is in the future. Check the phone's clock.
                  summary: Phone clock ahead
                KioskWithoutABadge:
                  value:
                    code: validation_error
                    message: Invalid input.
                    details:
                      badge:
                      - A kiosk only records badge scans.
                  summary: Kiosk without a badge
          description: The request is invalid; `details` maps each field to its errors.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                NotAuthenticated:
                  value:
                    code: not_authenticated
                    message: Invalid or revoked device token.
                    details: {}
                  summary: not_authenticated
          description: Missing, invalid or revoked device token. Sign in again with
            the PIN.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                NotYourSite:
                  value:
                    code: permission_denied
                    message: You do not have permission to perform this action.
                    details: {}
                  summary: Not your site
                KioskForAnotherSite:
                  value:
                    code: permission_denied
                    message: This phone is a kiosk for another site.
                    details: {}
                  summary: Kiosk for another site
          description: Signed in, but not allowed (for example a site you are not
            assigned to).
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                Conflict:
                  value:
                    code: conflict
                    message: This client_uuid was already used for a different request.
                    details:
                      client_uuid: 6f1c2b9e-1d1a-4c55-9a52-3f0e8a9d7b10
                  summary: conflict
          description: The request conflicts with the current state.
  /api/v1/files/checkins/{checkin_id}/photo/:
    get:
      operationId: file_checkin_photo
      description: The URL comes as `photo_url` in a check-in. Send the `Authorization`
        header. `404` if the check-in has no photo or is not on one of your sites.
      summary: A check-in's photo
      parameters:
      - in: header
        name: If-None-Match
        schema:
          type: string
        description: The `ETag` of the copy the phone already has.
      - in: path
        name: checkin_id
        schema:
          type: integer
        required: true
      tags:
      - files
      security:
      - DeviceToken: []
      - cookieAuth: []
      responses:
        '200':
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
          description: 'The file, with an `ETag`: send it back in `If-None-Match`
            to get `304 Not Modified` instead of the bytes.'
        '304':
          description: 'Not modified: the cached copy is current.'
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                NotAuthenticated:
                  value:
                    code: not_authenticated
                    message: Invalid or revoked device token.
                    details: {}
                  summary: not_authenticated
          description: Missing, invalid or revoked device token. Sign in again with
            the PIN.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                NotFound:
                  value:
                    code: not_found
                    message: Not found.
                    details: {}
                  summary: not_found
          description: The resource does not exist.
  /api/v1/files/proofs/{payment_id}/:
    get:
      operationId: file_payment_proof
      description: The URL comes as `proof_url` in `POST /payments/`. Send the `Authorization`

          format: date-time
          description: 'When the cash was handed over, from the phone clock (offline
            payments are sent later). Default: the time the server receives it.'
      required:
      - amount
      - client_uuid
      - pay_line_id
      - proof_type
    PaymentRules:
      type: object
      properties:
        accepted_proofs:
          type: array
          items:
            $ref: '#/components/schemas/ProofTypeEnum'
          description: 'Proof types `POST /payments/` accepts (company setting). Offer
            only these on the payout screen; `none` (no proof) is accepted only when
            it is listed. Anything else: `400 validation_error` on `proof_type`.'
        file_required_for:
          type: array
          items:
            $ref: '#/components/schemas/ProofTypeEnum'
          description: 'Proof types that must come with a `proof_file` (today `photo`).
            For the others a file is optional. Missing file: `400 validation_error`
            on `proof_file`.'
      required:
      - accepted_proofs
      - file_required_for
    PaymentSummary:
      type: object
      properties:
        id:
          type: integer
        client_uuid:
          type: string
          format: uuid
        amount:
          type: integer
          format: int64
          description: 'Money: an integer in the currency''s smallest unit (see the
            `currency` object of the same response). 5000 XOF (0 decimals) is 5000;
            12.50 EUR is 1250.'
        proof_type:
          $ref: '#/components/schemas/ProofTypeEnum'
        paid_at:
          type: string
          format: date-time
      required:
      - amount
      - client_uuid
      - id
      - paid_at
      - proof_type
    Payout:
      type: object
      properties:
        site_id:
          type: integer
        date:
          type: string
          format: date
        status:
          allOf:
          - $ref: '#/components/schemas/PayoutStatusEnum'
          description: |-
            `not_open`: the roll call is not approved yet; figures are a preview and payments are refused (409).

            * `not_open` - Not open (waiting for approval)
            * `open` - Open
            * `paid` - Everyone paid
            * `closed` - Closed by the office
        day_status:
          $ref: '#/components/schemas/DayStatusEnum'
        approved_at:
          type: string
          format: date-time
          nullable: true
        currency:
          $ref: '#/components/schemas/Currency'
        cash_issued:
          type: integer
          format: int64
          description: Cash handed to the foreman for this sheet.
        total_to_pay:
          type: integer
          format: int64
          description: Sum of `net` over all lines.
        paid_total:
          type: integer
          format: int64
          description: Sum of payments made.
        left_to_pay:
          type: integer
          format: int64
          description: total_to_pay − paid_total.
        cash_in_hand:
          type: integer
          format: int64
          description: 'cash_issued − paid_total: what the foreman should hold now
            (and return to the office once everyone is paid).'
        line_count:
          type: integer
        paid_count:
          type: integer
        lines:
          type: array
          items:
            $ref: '#/components/schemas/PayoutLine'
      required:
      - approved_at
      - cash_in_hand
      - cash_issued
      - currency
      - date
      - day_status
      - left_to_pay
      - line_count
      - lines
      - paid_count
      - paid_total
      - site_id
      - status
      - total_to_pay
    PayoutLine:
      type: object
      properties:
        pay_line_id:
          type: integer
          description: Send this to `POST /payments/`. Stable for this worker and
            pay period while the figures are recomputed; a new id only if the worker
            left the sheet (no worked day in the period) and came back.
        worker:
          $ref: '#/components/schemas/PayoutWorker'
        worked:
          type: string
          description: Translated label of what was worked, e.g. '1 day', '½ day',
            '1 day · late'.
        units:
          type: string
          format: decimal
          pattern: ^-?\d{0,4}(?:\.\d{0,2})?$
          description: Units paid (days or hours, by pay type), as a decimal string.
        gross:
          type: integer
          format: int64
          description: Earned for the day.
        advance_deduction:
          type: integer
          format: int64
          description: Advance repayment taken from this pay (0 if none).
        net:
          type: integer
          format: int64
          description: 'Hand over: gross − advance_deduction, plus any correction
            adjustment (see README "Payments"), so it can differ from that difference.
            Never negative.'
        payment:
          allOf:
          - $ref: '#/components/schemas/PaymentSummary'
          nullable: true
          description: Null until paid.
      required:
      - advance_deduction
      - gross
      - net
      - pay_line_id
      - payment
      - units
      - worked
      - worker
    PayoutStatusEnum:
      enum:
      - not_open
      - open
      - paid
      - closed
      type: string
      description: |-
        * `not_open` - Not open (waiting for approval)
        * `open` - Open
        * `paid` - Everyone paid
        * `closed` - Closed by the office
    PayoutWorker:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        trade:
          type: string
          nullable: true
        photo_url:
          type: string
          format: uri
          nullable: true
      required:
      - id
      - name
      - photo_url
      - trade
    PersonRef:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
      required:
      - id
      - name
    PinLoginRequest:
      type: object
      properties:
        phone:
          type: string
          minLength: 1
          description: The foreman's phone number, as entered on the User record.
          maxLength: 32
        pin:
          type: string
          writeOnly: true
          minLength: 1
          description: The 4-digit PIN.
          maxLength: 4
          pattern: ^\d{4}$
        device_id:
          type: string
          minLength: 1
          description: Stable install ID made by the app on first launch (UUID). One
            token per device.
          maxLength: 128
        device_name:
          type: string
          description: e.g. 'Tecno Spark 10'.
          maxLength: 100
      required:
      - device_id
      - phone
      - pin
    PinLoginResponse:
      type: object
      properties:
        token:
          type: string
          description: 'Device token. Shown once; keep it in secure storage. Send
            it as `Authorization: Device <token>`.'
        device:
          $ref: '#/components/schemas/Device'
        user:
          $ref: '#/components/schemas/UserProfile'
        sites:
          type: array
          items:
            $ref: '#/components/schemas/AssignedSite'
      required:
      - device
      - sites
      - token
      - user
    PresenceEventBatchRequest:
      type: object
      description: The request as documented (``EventBatchSerializer`` validates it).
      properties:
        events:
          type: array
          items:
            $ref: '#/components/schemas/PresenceEventRequest'
      required:
      - events
    PresenceEventRequest:
      type: object
      description: Same shape as ``PresenceEvent`` in ``tracker-openapi.yaml``.
      properties:
        event_id:
          type: string
          format: uuid
          description: Unique; stored once.
        site_id:
          type: integer
          maximum: 9223372036854775807
          minimum: 1
          format: int64
        subject:
          $ref: '#/components/schemas/SubjectRequest'
        type:
          $ref: '#/components/schemas/PresenceEventTypeEnum'
        at:
          type: string
          format: date-time
          description: '`entered`: first sighting of the visit; `moved_zone`: first
            sighting in the new zone; `left`: last sighting on the site.'
        zone_id:
          type: string
          nullable: true
          description: Zone code, or null.
          maxLength: 64
        from_zone_id:
          type: string
          nullable: true
          description: Only for `moved_zone`.
          maxLength: 64
        reason:
          allOf:
          - $ref: '#/components/schemas/PresenceLeaveReasonEnum'
          nullable: true
          description: |-
            Only for `left`.

            * `timeout` - Not seen for `absence_to_leave_seconds`
            * `left_geofence` - A GPS fix clearly outside the site
      required:
      - at
      - event_id
      - from_zone_id
      - reason
      - site_id
      - subject
      - type
      - zone_id
    PresenceEventTypeEnum:
      enum:
      - entered
      - moved_zone
      - left
      type: string
      description: |-
        * `entered` - Arrived on the site
        * `moved_zone` - Moved to another zone
        * `left` - Left the site
    PresenceIngestResult:
      type: object
      properties:
        stored:
          type: integer
          description: New events, applied to the sessions.
        duplicates:
          type: integer
          description: Already stored earlier (same `event_id`), or twice in this
            batch.
        ignored:
          type: integer
          description: 'New, stored, but not applied: an unknown site or subject (or
            another company''s), a site of an inactive company, a worker inactive
            or with tracking off, a foreman who had not accepted the notice at the
            event''s time.'
        rejected:
          type: integer
          description: 'Items that do not match the schema: not stored, listed in
            the log. The batch still counts as delivered.'
      required:
      - duplicates
      - ignored
      - rejected
      - stored
    PresenceLeaveReasonEnum:
      enum:
      - timeout
      - left_geofence
      type: string
      description: |-
        * `timeout` - Not seen for `absence_to_leave_seconds`
        * `left_geofence` - A GPS fix clearly outside the site
    PresenceSession:
      type: object
      properties:
        subject:
          $ref: '#/components/schemas/Subject'
        first_seen_at:
          type: string
          format: date-time
        last_seen_at:
          type: string
          format: date-time
          nullable: true
          description: Null while the person is still on site.
        open:
          type: boolean
        zones:
          type: array
          items:
            type: string
          description: Zone codes visited, in order of first visit.
        visits:
          type: integer
          description: Separate visits (entered → left) that day.
      required:
      - first_seen_at
      - last_seen_at
      - open
      - subject
      - visits
      - zones
    PresenceSubjectKindEnum:
      enum:
      - worker
      - foreman
      type: string
      description: |-
        * `worker` - A worker (`Worker` id)
        * `foreman` - A foreman (user id)
    ProofTypeEnum:
      enum:
      - photo
      - signature
      - thumb_mark
      - none
      type: string
      description: |-
        * `photo` - Photo
        * `signature` - Signature
        * `thumb_mark` - Thumb mark
        * `none` - No proof
    RecordBatchRequest:
      type: object
      properties:
        records:
          type: array
          items:
            $ref: '#/components/schemas/RecordUpsertRequest'
      required:
      - records
    RecordUpsertRequest:
      type: object
      properties:
        client_uuid:
          type: string
          format: uuid
          description: One per worker per day, made on the phone the first time the
            worker is marked; reuse it for every later change of that record.
        worker_id:
          type: integer
        status:
          $ref: '#/components/schemas/AttendanceStatusEnum'
        arrival:
          type: string
          pattern: ^([01]\d|2[0-3]):[0-5]\d$
          example: '07:00'
          description: Local wall-clock time on the site, 24-hour `HH:MM`.
          nullable: true
        departure:
          type: string
          pattern: ^([01]\d|2[0-3]):[0-5]\d$
          example: '07:00'
          description: Local wall-clock time on the site, 24-hour `HH:MM`.
          nullable: true
        note:
          type: string
          default: ''
          maxLength: 500
        from_suggestion:
          type: array
          items:
            $ref: '#/components/schemas/SuggestionSourceEnum'
          description: '1.5: the mark is a roll-call suggestion the foreman accepted
            (or the phone pre-filled), with its `sources` from `GET .../suggestions/`:
            `[checkin]`, `[presence]` or `[checkin, presence]`. Empty or left out:
            marked by hand. Recorded in the audit entry of the batch; it changes nothing
            else.'
          maxItems: 2
      required:
      - client_uuid
      - status
      - worker_id
    RollCallSuggestion:
      type: object
      properties:
        worker_id:
          type: integer
        status:
          allOf:
          - $ref: '#/components/schemas/AttendanceStatusEnum'
          nullable: true
          description: |-
            `null` when the worker only checked out: let the foreman decide.

            * `present` - Present
            * `absent` - Absent
            * `half_day` - Half day
            * `late` - Late
        arrival:
          type: string
          pattern: ^([01]\d|2[0-3]):[0-5]\d$
          example: '07:00'
          description: Local wall-clock time on the site, 24-hour `HH:MM`.
          nullable: true
        departure:
          type: string
          pattern: ^([01]\d|2[0-3]):[0-5]\d$
          example: '07:00'
          description: Local wall-clock time on the site, 24-hour `HH:MM`.
          nullable: true
        first_in_at:
          type: string
          format: date-time
          nullable: true
        last_out_at:
          type: string
          format: date-time
          nullable: true
        checkin_count:
          type: integer
          description: '`0` for a presence-only suggestion.'
        sources:
          type: array
          items:
            $ref: '#/components/schemas/SuggestionSourceEnum'
          description: 'Where the suggestion comes from (1.5): `[checkin]`, `[presence]`
            or `[checkin, presence]`. With check-ins, `status`, `arrival` and `departure`
            come from the check-ins.'
        presence:
          allOf:
          - $ref: '#/components/schemas/SuggestionPresence'
          nullable: true
          description: What presence tracking saw (1.5); `null` without a presence
            (tracking off for the site or the worker, or not seen).
      required:
      - arrival
      - checkin_count
      - departure
      - first_in_at
      - last_out_at
      - presence
      - sources
      - status
      - worker_id
    RollCallSuggestions:
      type: object
      properties:
        site_id:
          type: integer
        date:
          type: string
          format: date
        attendance_mode:
          $ref: '#/components/schemas/AttendanceModeEnum'
        late_after:
          type: string
          pattern: ^([01]\d|2[0-3]):[0-5]\d$
          example: '07:00'
          description: Local wall-clock time on the site, 24-hour `HH:MM`.
        day_status:
          $ref: '#/components/schemas/DayStatusEnum'
        suggestions:
          type: array
          items:
            $ref: '#/components/schemas/RollCallSuggestion'
      required:
      - attendance_mode
      - date
      - day_status
      - late_after
      - site_id
      - suggestions
    SeverityEnum:
      enum:
      - danger
      - warning
      type: string
      description: |-
        * `danger` - Danger
        * `warning` - Warning
    SitePresenceSessions:
      type: object
      properties:
        site_id:
          type: integer
        date:
          type: string
          format: date
        sessions:
          type: array
          items:
            $ref: '#/components/schemas/PresenceSession'
      required:
      - date
      - sessions
      - site_id
    SiteRef:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
      required:
      - id
      - name
    SourceEnum:
      enum:
      - foreman_scan
      - kiosk
      - manual
      type: string
      description: |-
        * `foreman_scan` - Badge scanned by the foreman's phone
        * `kiosk` - Badge scanned on a kiosk phone
        * `manual` - Worker picked by hand on the foreman's phone
    Subject:
      type: object
      properties:
        kind:
          $ref: '#/components/schemas/PresenceSubjectKindEnum'
        id:
          type: integer
          maximum: 9223372036854775807
          minimum: 1
          format: int64
      required:
      - id
      - kind
    SubjectRequest:
      type: object
      properties:
        kind:
          $ref: '#/components/schemas/PresenceSubjectKindEnum'
        id:
          type: integer
          maximum: 9223372036854775807
          minimum: 1
          format: int64
      required:
      - id
      - kind
    SubmitDayRequest:
      type: object
      properties:
        client_uuid:
          type: string
          format: uuid
          description: Made on the phone when the user acts (UUID v4). Sending the
            same client_uuid again returns the original result instead of applying
            the write twice.
        foreman_note:
          type: string
          default: ''
          description: Optional note for the site manager.
          maxLength: 1000
        submitted_at:
          type: string
          format: date-time
          nullable: true
          description: When the foreman tapped Submit, from the phone clock (ISO 8601
            with offset). Optional. The office flags a roll call that reached the
            server an hour or more later. The day's own `submitted_at` stays the server
            time.
      required:
      - client_uuid
    SuggestionPresence:
      type: object
      properties:
        first_seen_at:
          type: string
          format: date-time
          description: First sighting on the site that day.
        last_seen_at:
          type: string
          format: date-time
          nullable: true
          description: Last sighting; `null` while the worker is still on site.
        open:
          type: boolean
          description: Still on site (no `last_seen_at`).
        seen_from:
          type: string
          pattern: ^([01]\d|2[0-3]):[0-5]\d$
          example: '07:00'
          description: '`first_seen_at`, company time zone (`HH:MM`).'
        seen_until:
          type: string
          pattern: ^([01]\d|2[0-3]):[0-5]\d$
          example: '07:00'
          description: '`last_seen_at`, company time zone; `null` while open.'
          nullable: true
        zones:
          type: array
          items:
            type: string
          description: Zone codes visited, in order (may be empty).
        visits:
          type: integer
          description: Visits that day (left and came back).
        status:
          allOf:
          - $ref: '#/components/schemas/AttendanceStatusEnum'
          description: |-
            What the presence alone suggests (same rules as a presence-only suggestion), to show when it differs from the check-ins.

            * `present` - Present
            * `absent` - Absent
            * `half_day` - Half day
            * `late` - Late
      required:
      - first_seen_at
      - last_seen_at
      - open
      - seen_from
      - seen_until
      - status
      - visits
      - zones
    SuggestionSourceEnum:
      enum:
      - checkin
      - presence
      type: string
      description: |-
        * `checkin` - Counted check-ins of the worker
        * `presence` - Presence tracking (badge or phone seen on site)
    Sync:
      type: object
      properties:
        server_time:
          type: string
          format: date-time
          description: Store it and send it as `since` next time. Taken before reading
            changes, so nothing is missed (an item may come twice; apply as upserts
            by id).
        since:
          type: string
          format: date-time
          nullable: true
        days:
          type: array
          items:
            $ref: '#/components/schemas/AttendanceDaySummary'
        records:
          type: array
          items:
            $ref: '#/components/schemas/AttendanceRecord'
        corrections:
          type: array
          items:
            $ref: '#/components/schemas/Correction'
      required:
      - corrections
      - days
      - records
      - server_time
      - since
    Today:
      type: object
      properties:
        date:
          type: string
          format: date
        now:
          type: string
          description: Local time, ISO 8601.
        is_working_day:
          type: boolean
        totals:
          $ref: '#/components/schemas/TodayTotals'
        sites:
          type: array
          items:
            $ref: '#/components/schemas/TodaySite'
        waiting_for_approval:
          type: integer
        alerts:
          type: array
          items:
            $ref: '#/components/schemas/Alert'
      required:
      - alerts
      - date
      - is_working_day
      - now
      - sites
      - totals
      - waiting_for_approval
    TodaySite:
      type: object
      properties:
        site:
          $ref: '#/components/schemas/SiteRef'
        foreman:
          type: string
        day_id:
          type: integer
          nullable: true
        status:
          $ref: '#/components/schemas/DayStatusEnum'
        roll_call_due:
          type: string
          description: '`HH:MM`.'
        overdue:
          type: boolean
          description: The roll call is late (not yet submitted).
        expected:
          type: integer
        present:
          type: integer
        absent:
          type: integer
        half:
          type: integer
        late:
          type: integer
        cash_tonight:
          allOf:
          - $ref: '#/components/schemas/Money'
          nullable: true
      required:
      - absent
      - cash_tonight
      - day_id
      - expected
      - foreman
      - half
      - late
      - overdue
      - present
      - roll_call_due
      - site
      - status
    TodayTotals:
      type: object
      properties:
        expected:
          type: integer
        present:
          type: integer
        absent:
          type: integer
        half:
          type: integer
          description: Half days.
        late:
          type: integer
        cash_tonight:
          allOf:
          - $ref: '#/components/schemas/Money'
          description: Cash to pay out tonight on every active site.
      required:
      - absent
      - cash_tonight
      - expected
      - half
      - late
      - present
    TrackingHours:
      type: object
      properties:
        start:
          type: string
          pattern: ^([01]\d|2[0-3]):[0-5]\d$
          example: '07:00'
          description: Local wall-clock time on the site, 24-hour `HH:MM`.
        end:
          type: string
          pattern: ^([01]\d|2[0-3]):[0-5]\d$
          example: '07:00'
          description: Local wall-clock time on the site, 24-hour `HH:MM`.
      required:
      - end
      - start
    TrackingSettings:
      type: object
      properties:
        gps_interval_seconds:
          type: integer
          description: Setting `foreman_gps_interval_seconds` (the shortest of the
            token's sites).
        tracking_hours:
          allOf:
          - $ref: '#/components/schemas/TrackingHours'
          description: Settings `tracking_start` / `tracking_end`, company time zone
            (the earliest start and the latest end of the token's sites). No GPS outside
            them.
        retention_days:
          type: integer
          description: 'Setting `track_retention_days`: raw positions are deleted
            after this.'
      required:
      - gps_interval_seconds
      - retention_days
      - tracking_hours
    TrackingToken:
      type: object
      properties:
        token:
          type: string
          description: JWT (HS256) for the tracker, `kind = "device"`.
        expires_at:
          type: string
          format: date-time
          description: 12 hours after issue. Ask again before.
        tracker_url:
          type: string
          description: Base URL of the tracker service.
        sites:
          type: array
          items:
            type: integer
          description: 'Sites the token covers (its `sites` claim): your sites with
            tracking on.'
        settings:
          $ref: '#/components/schemas/TrackingSettings'
      required:
      - expires_at
      - settings
      - sites
      - token
      - tracker_url
    UserProfile:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
          description: Full name; the app derives initials from it.
        role:
          $ref: '#/components/schemas/UserRoleEnum'
        phone:
          type: string
        language:
          allOf:
          - $ref: '#/components/schemas/LanguageEnum'
          description: |-
            UI language for this user (falls back to company).

            * `en` - English
            * `fr` - French
      required:
      - id
      - language
      - name
      - phone
      - role
    UserRoleEnum:
      enum:
      - admin
      - site_manager
      - foreman
      - accountant
      type: string
      description: |-
        * `admin` - Admin
        * `site_manager` - Site manager
        * `foreman` - Foreman
        * `accountant` - Accountant
    WaitingDay:
      type: object
      properties:
        day_id:
          type: integer
        site:
          $ref: '#/components/schemas/SiteRef'
        date:
          type: string
          format: date
        foreman:
          type: string
        submitted_at:
          type: string
          nullable: true
          description: Local time, ISO 8601.
        counts:
          $ref: '#/components/schemas/DayCounts'
        flags:
          type: array
          items:
            type: string
          description: 'Why to look twice: corrections, a roll call that synced late.'
      required:
      - counts
      - date
      - day_id
      - flags
      - foreman
      - site
      - submitted_at
    WorkerDay:
      type: object
      properties:
        date:
          type: string
          format: date
        site:
          $ref: '#/components/schemas/SiteRef'
        day_status:
          $ref: '#/components/schemas/DayStatusEnum'
        status:
          $ref: '#/components/schemas/AttendanceStatusEnum'
        arrival:
          type: string
          nullable: true
        departure:
          type: string
          nullable: true
        note:
          type: string
        corrected:
          type: boolean
      required:
      - arrival
      - corrected
      - date
      - day_status
      - departure
      - note
      - site
      - status
    WorkerDetail:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        number:
          type: string
          description: Employee number.
        trade:
          type: string
          description: Empty when the worker has no trade.
        active:
          type: boolean
        site:
          allOf:
          - $ref: '#/components/schemas/SiteRef'
          nullable: true
        days:
          type: array
          items:
            $ref: '#/components/schemas/WorkerDay'
        pay:
          type: array
          items:
            $ref: '#/components/schemas/WorkerPay'
        advance_balance:
          allOf:
          - $ref: '#/components/schemas/Money'
          description: Still owed on open salary advances.
        from:
          type: string
          format: date
        to:
          type: string
          format: date
      required:
      - active
      - advance_balance
      - days
      - from
      - id
      - name
      - number
      - pay
      - site
      - to
      - trade
    WorkerList:
      type: object
      properties:
        workers:
          type: array
          items:
            $ref: '#/components/schemas/WorkerMatch'
      required:
      - workers
    WorkerMatch:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        number:
          type: string
          description: Employee number.
        trade:
          type: string
          description: Empty when the worker has no trade.
        site:
          allOf:
          - $ref: '#/components/schemas/SiteRef'
          nullable: true
          description: Where the worker is assigned today.
      required:
      - id
      - name
      - number
      - site
      - trade
    WorkerPay:
      type: object
      properties:
        site:
          $ref: '#/components/schemas/SiteRef'
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        period_status:
          type: string
        units:
          type: string
          format: decimal
          pattern: ^-?\d{0,4}(?:\.\d{0,2})?$
        gross:
          $ref: '#/components/schemas/Money'
        advance_deduction:
          $ref: '#/components/schemas/Money'
        statutory_deductions:
          $ref: '#/components/schemas/Money'
        other_deductions:
          $ref: '#/components/schemas/Money'
        adjustment:
          $ref: '#/components/schemas/Money'
        net:
          $ref: '#/components/schemas/Money'
        paid:
          $ref: '#/components/schemas/Money'
      required:
      - adjustment
      - advance_deduction
      - end_date
      - gross
      - net
      - other_deductions
      - paid
      - period_status
      - site
      - start_date
      - statutory_deductions
      - units
    WorkerRef:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        number:
          type: string
          description: Employee number.
        trade:
          type: string
          description: Empty when the worker has no trade.
      required:
      - id
      - name
      - number
      - trade
  securitySchemes:
    AgentToken:
      type: http
      scheme: bearer
      description: 'Agent token from the office screen *AI assistant access*, sent
        as `Authorization: Bearer pol_…`. Opens only `/api/v1/office/`.'
    DeviceToken:
      type: apiKey
      in: header
      name: Authorization
      description: 'Device token from `POST /api/v1/auth/pin/`, sent as `Authorization:
        Device <token>`.'
    TrackerService:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'A JWT (HS256) the tracker service mints with `TRACKER_SHARED_SECRET`:
        `kind = "service"`, `sub = "service:tracker"`, `aud = "polaris-django"`, `exp`
        at most 5 minutes ahead. Opens only `POST /api/v1/presence/events/`.'
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
tags:
- name: system
  description: Reachability.
- name: accounts
  description: 'PIN sign-in, sign-out, profile (Wave 2: A).'
- name: worksites
  description: 'Crew lists (Wave 2: B).'
- name: attendance
  description: 'Roll call, corrections, sync (Wave 2: C).'
- name: payroll
  description: 'Cash payout and payments (Wave 2: D).'
- name: checkin
  description: QR badges, kiosk phones, check-ins and roll-call suggestions (Wave
    4).
- name: office
  description: 'Office API for AI assistants: read-only, plus approving or sending
    back a roll call after a preview. Agent tokens only.'
- name: presence
  description: 'Presence tracking (1.4): the phone''s tracker token and consent, presence
    sessions per site and day, and the tracker service''s event ingest.'
- name: files
  description: Worker photos and payment proofs; send the Authorization header.

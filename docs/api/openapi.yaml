  /api/v1/payments/:
    post:
      operationId: payment_create
      description: |-
        Records that a worker received their pay. Send `multipart/form-data` when there is a proof file, JSON otherwise.

        201 when created; repeating the same `client_uuid` returns the original payment with 200 and `Idempotent-Replayed: true` (send the file again on a retry; it is ignored on a replay). The line already paid under another `client_uuid`, or the sheet `not_open`: `409 conflict`. Sheet closed or period locked: `423 locked`.

        Proof rules come from `GET /me/` → `company.payments`: `proof_type` must be in `accepted_proofs`, and a type in `file_required_for` (`photo`) needs `proof_file`. `amount` must equal what is left to pay on the line (its `net` when unpaid). A `pay_line_id` that no longer exists: `404 not_found`.
      summary: Record a payment with proof
      tags:
      - payroll
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PaymentCreateRequest'
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentCreateRequest'
            examples:
              PayWithPhotoProof:
                value:
                  client_uuid: e4b1c9d2-6a3f-4d8e-b7c0-1a2b3c4d5e61
                  pay_line_id: 801
                  amount: 4000
                  proof_type: photo
                  paid_at: '2026-10-31T16:31:00Z'
                summary: Pay with photo proof
        required: true
      security:
      - DeviceToken: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
              examples:
                Paid:
                  value:
                    id: 3301
                    client_uuid: e4b1c9d2-6a3f-4d8e-b7c0-1a2b3c4d5e61
                    amount: 4000
                    proof_type: photo
                    paid_at: '2026-10-31T16:31:00Z'
                    pay_line_id: 801
                    currency:
                      code: XOF
                      decimals: 0
                    proof_url: https://polaris.example.com/media/proofs/2026/10/receipt-3301.jpg
                    paid_by:
                      id: 7
                      name: Kossi Amegah
          description: ''
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
              examples:
                Paid:
                  value:
                    id: 3301
                    client_uuid: e4b1c9d2-6a3f-4d8e-b7c0-1a2b3c4d5e61
                    amount: 4000
                    proof_type: photo
                    paid_at: '2026-10-31T16:31:00Z'
                    pay_line_id: 801
                    currency:
                      code: XOF
                      decimals: 0
                    proof_url: https://polaris.example.com/media/proofs/2026/10/receipt-3301.jpg
                    paid_by:
                      id: 7
                      name: Kossi Amegah
          description: ''

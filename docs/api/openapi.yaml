      parameters:
      - in: query
        name: from
        schema:
          type: string
          format: date
      - in: path
        name: site_id
        schema:
          type: integer
        description: A site the signed-in foreman is assigned to (from `GET /me/`).
        required: true
      - in: query
        name: to
        schema:
          type: string
          format: date
      tags:
      - attendance
      security:
      - DeviceToken: []
      - cookieAuth: []
      responses:

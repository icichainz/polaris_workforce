[project]
name = "polaris-mcp"
version = "0.1.0"
description = "MCP server that lets office staff use Polaris Workforce from Claude"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28",
    "mcp>=1.20",
]

[project.scripts]
polaris-mcp = "polaris_mcp.__main__:main"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

name: django

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: polaris_workforce
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      # DEBUG is off by default and then needs a secret key; pytest uses tests/settings.py.
      - run: uv run python manage.py makemigrations --check --dry-run
        env:
          DJANGO_DEBUG: "true"
      - run: uv run pytest

# Polaris Workforce — the single entry point (http://localhost:8080 by default).
#   /static/           collected static files (shared volume with the web container);
#                      hashed names (app.3f2a9c81d0e4.css) are kept by browsers for a year
#   /protected-media/  uploads, internal only: Django checks access, then answers with
#                      X-Accel-Redirect (PROTECTED_MEDIA_MODE=nginx); never public
#   /tracker/          the Gleam presence tracker (SSE-friendly: no buffering)
#   everything else    Django (office, worker portal, phone API)
#
# TLS: terminate HTTPS here or in front of this proxy, and pass the real scheme in
# X-Forwarded-Proto; then remove DJANGO_SECURE_SSL_REDIRECT/DJANGO_SECURE_COOKIES=false.

upstream django {
    server web:8000;
}

upstream tracker {
    server tracker:4100;
}

server {
    listen 80;
    server_name _;

    # Proof photos and documents are at most 5 MB; leave room for the form fields.
    client_max_body_size 8m;

    add_header X-Content-Type-Options nosniff always;

    # Compress text: office pages shrink about tenfold (48 KB → 5 KB), which is most of
    # the wait on mobile data. HTML is always included; the phone API's JSON too. The
    # tracker's event stream is not listed, so it is never buffered for compression.
    # BREACH: Django masks the CSRF token differently in every response.
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /static/ {
        root /srv;
        access_log off;
        # Unhashed names (app.css): the pages never link to them, keep them briefly.
        expires 1h;

        # Hashed names (ManifestStaticFilesStorage) never change content: a deploy links
        # to new names, so browsers may keep these without asking again.
        location ~ "\.[0-9a-f]{12}\.[A-Za-z0-9]+$" {
            expires off;  # not the 1h above: the header below says it all
            add_header Cache-Control "public, max-age=31536000, immutable";
            # add_header here replaces the server's: repeat it.
            add_header X-Content-Type-Options nosniff always;
        }
    }

    location /protected-media/ {
        internal;
        alias /data/media/;
    }

    location /tracker/ {
        proxy_pass http://tracker/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    location / {
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_read_timeout 120s;
    }
}

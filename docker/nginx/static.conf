# Polaris Workforce — static files only, in production (docker-compose.prod.yml).
# Caddy terminates HTTPS and sends /static/* here; Django and the tracker are behind
# Caddy directly. Uploads are not served here: Django checks access and sends them itself
# (PROTECTED_MEDIA_MODE=django). The local setup uses default.conf instead.

server {
    listen 80;
    server_name _;

    add_header X-Content-Type-Options nosniff always;

    # BREACH does not apply: static files carry no secrets.
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /static/ {
        root /srv;
        access_log off;
        # Unhashed names (app.css): the pages never link to them, keep them briefly.
        expires 1h;

        # Hashed names (ManifestStaticFilesStorage) never change content: a deploy links
        # to new names, so browsers may keep these without asking again.
        location ~ "\.[0-9a-f]{12}\.[A-Za-z0-9]+$" {
            expires off;  # not the 1h above: the header below says it all
            add_header Cache-Control "public, max-age=31536000, immutable";
            # add_header here replaces the server's: repeat it.
            add_header X-Content-Type-Options nosniff always;
        }
    }

    location / {
        return 404;
    }
}

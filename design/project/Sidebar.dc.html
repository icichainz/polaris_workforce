<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sidebar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&amp;family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<nav aria-label="Main" style="width: 100%; min-height: 960px; box-sizing: border-box; background: #16191D; color: #C9CDD3; font-family: Inter, system-ui, sans-serif; padding: 20px 14px; display: flex; flex-direction: column; gap: 20px">
  <a href="Dashboard.dc.html" style="display: flex; align-items: center; gap: 10px; text-decoration: none; color: #FFFFFF; padding: 4px 8px">
    <span style="width: 34px; height: 34px; border-radius: 9px; background: #F5B000; display: flex; align-items: center; justify-content: center">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#16191D" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 18h20M4 18v-2a8 8 0 0 1 16 0v2M10 8V5h4v3"></path></svg>
    </span>
    <span style="display: flex; flex-direction: column; line-height: 1.1"><span style="font-family: Archivo, sans-serif; font-weight: 800; font-size: 19px">Polaris</span><span style="font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #C9CDD3">Workforce</span></span>
  </a>

  <button type="button" style="display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 12px; border: 1px solid #2E343C; border-radius: 8px; background: #1E2227; color: #FFFFFF; font: 500 14px Inter, sans-serif; text-align: left">
    <span style="flex-grow: 1; display: flex; flex-direction: column; line-height: 1.2"><span style="font-size: 11px; color: #A3A9B2">Viewing</span>All sites · 3</span>
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#C9CDD3" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg>
  </button>

  <sc-for list="{{groups}}" as="g" hint-placeholder-count="5">
    <div style="display: flex; flex-direction: column; gap: 2px">
      <div style="font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: #969DA7; padding: 0 10px 6px">{{g.label}}</div>
      <sc-for list="{{g.items}}" as="it" hint-placeholder-count="2">
        <a href="{{it.href}}" aria-current="{{it.current}}" style="display: flex; align-items: center; gap: 12px; height: 40px; padding: 0 10px; border-radius: 8px; text-decoration: none; font-size: 14px; font-weight: 500; background: {{it.bg}}; color: {{it.fg}}">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{it.iconColor}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{it.icon}}"></path></svg>
          <span style="flex-grow: 1">{{it.label}}</span>
          <sc-if value="{{it.hasBadge}}" hint-placeholder-val="{{false}}">
            <span style="min-width: 22px; height: 22px; padding: 0 6px; box-sizing: border-box; border-radius: 999px; background: #F5B000; color: #16191D; font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center">{{it.badge}}</span>
          </sc-if>
        </a>
      </sc-for>
    </div>
  </sc-for>

  <div style="flex-grow: 1"></div>

  <div style="display: flex; align-items: center; gap: 10px; padding: 10px; border-top: 1px solid #2E343C">
    <span style="width: 36px; height: 36px; border-radius: 999px; background: #2E343C; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px">EK</span>
    <span style="flex-grow: 1; display: flex; flex-direction: column; line-height: 1.3"><span style="color: #FFFFFF; font-size: 14px; font-weight: 600">Edem Kpodar</span><span style="font-size: 12px; color: #A3A9B2">Admin</span></span>
    <a href="Login.dc.html" aria-label="Sign out" style="width: 36px; height: 36px; border-radius: 8px; display: flex; align-items: center; justify-content: center">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#C9CDD3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5V3h4M16 17l5-5-5-5M21 12H9"></path></svg>
    </a>
  </div>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["dashboard","approvals","cash","payroll","advances","workers","sites","reports","users","settings"],"default":"dashboard"},"$preview":{"width":248,"height":960}}'>
class Component extends DCLogic {
  renderVals() {
    const active = this.props.active ?? 'dashboard';
    const I = {
      dashboard: 'M3 3h7v9H3zM14 3h7v5h-7zM14 12h7v9h-7zM3 16h7v5H3z',
      approvals: 'M9 3h6v4H9zM7 5H5v16h14V5h-2M9 14l2 2 4-4',
      cash: 'M2 6h20v12H2zM12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM6 10v.01M18 14v.01',
      payroll: 'M3 5h18v16H3zM3 10h18M8 3v4M16 3v4',
      advances: 'M12 3v12M7 10l5 5 5-5M4 21h16',
      workers: 'M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM22 21v-2a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8',
      sites: 'M3 21h18M5 21V7l7-4 7 4v14M9 21v-6h6v6',
      reports: 'M4 20V10M10 20V4M16 20v-7M22 20H2',
      users: 'M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z',
      settings: 'M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M14 4v4M8 10v4M16 16v4'
    };
    const item = (key, label, href, badge) => {
      const on = key === active;
      return {
        label, href, icon: I[key], badge: badge || '', hasBadge: !!badge,
        current: on ? 'page' : 'false',
        bg: on ? '#2A3038' : 'transparent',
        fg: on ? '#FFFFFF' : '#C9CDD3',
        iconColor: on ? '#F5B000' : '#A3A9B2'
      };
    };
    return {
      groups: [
        { label: 'Overview', items: [item('dashboard', 'Today', 'Dashboard.dc.html')] },
        { label: 'Daily work', items: [item('approvals', 'Approvals', 'Approvals.dc.html', '3'), item('cash', 'Cash sheets', 'CashSheet.dc.html')] },
        { label: 'Pay', items: [item('payroll', 'Pay periods', 'Payroll.dc.html'), item('advances', 'Advances', 'Advances.dc.html')] },
        { label: 'People & sites', items: [item('workers', 'Workers', 'Workers.dc.html'), item('sites', 'Sites', 'Sites.dc.html')] },
        { label: 'Insight & admin', items: [item('reports', 'Reports', 'Reports.dc.html'), item('users', 'Users & roles', 'Users.dc.html'), item('settings', 'Settings', 'Settings.dc.html')] }
      ]
    };
  }
}
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Workers</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&amp;family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1A56C4}a:hover{color:#123E8F}
</style>
</helmet>
<div style="min-height: 100vh; display: flex; flex-wrap: wrap; background: #F4F5F7; color: #16191D; font-family: Inter, system-ui, sans-serif">
  <div style="flex: 1 1 248px; max-width: 100%; background: #16191D">
    <dc-import name="Sidebar" active="workers" hint-size="248px,960px"></dc-import>
  </div>
  <main style="flex: 999 1 560px; min-width: 0; box-sizing: border-box; padding: 28px 32px 56px">
    <div style="max-width: 1200px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px">
      <header style="display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px">
        <div style="display: flex; flex-direction: column; gap: 4px">
          <span style="font-size: 13px; font-weight: 600; color: #5B626E">104 active · 17 inactive</span>
          <h1 style="margin: 0; font-family: Archivo, sans-serif; font-weight: 800; font-size: 32px">Workers</h1>
        </div>
        <div style="display: flex; gap: 10px; flex-wrap: wrap">
          <button type="button" style="height: 40px; padding: 0 16px; border: 1px solid #C9CED6; border-radius: 8px; background: #FFFFFF; font: 600 14px Inter, sans-serif">Import from Excel</button>
          <a href="WorkerForm.dc.html" style="height: 40px; padding: 0 16px; border-radius: 8px; background: #F5B000; color: #16191D; font-weight: 600; font-size: 14px; display: flex; align-items: center; text-decoration: none">Add worker</a>
        </div>
      </header>

      <div style="display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end">
        <label style="flex: 2 1 280px; display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600">Search
          <input type="search" placeholder="Name, phone or worker ID" style="height: 40px; padding: 0 12px; border: 1px solid #C9CED6; border-radius: 8px; font: 400 14px Inter, sans-serif">
        </label>
        <label style="flex: 1 1 180px; display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600">Site
          <select style="height: 40px; padding: 0 10px; border: 1px solid #C9CED6; border-radius: 8px; background: #FFFFFF; font: 400 14px Inter, sans-serif"><option>All sites</option><option>Riverside Apartments</option><option>Market Hall Renovation</option><option>Route 4 Bridge</option></select>
        </label>
        <label style="flex: 1 1 160px; display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600">Trade
          <select style="height: 40px; padding: 0 10px; border: 1px solid #C9CED6; border-radius: 8px; background: #FFFFFF; font: 400 14px Inter, sans-serif"><option>All trades</option><option>Mason</option><option>Carpenter</option><option>Labourer</option></select>
        </label>
        <label style="flex: 1 1 140px; display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600">Status
          <select style="height: 40px; padding: 0 10px; border: 1px solid #C9CED6; border-radius: 8px; background: #FFFFFF; font: 400 14px Inter, sans-serif"><option>Active</option><option>Inactive</option><option>All</option></select>
        </label>
      </div>

      <section style="background: #FFFFFF; border: 1px solid #E3E5E9; border-radius: 10px">
        <div style="overflow-x: auto">
          <table style="width: 100%; border-collapse: collapse; font-size: 14px; min-width: 860px">
            <thead><tr style="text-align: left; background: #F8F9FA">
              <th style="padding: 10px 20px; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #5B626E">Worker</th>
              <th style="padding: 10px 16px; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #5B626E">Trade</th>
              <th style="padding: 10px 16px; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #5B626E">Site</th>
              <th style="padding: 10px 16px; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #5B626E">Phone</th>
              <th style="padding: 10px 16px; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #5B626E; text-align: right">Rate</th>
              <th style="padding: 10px 16px; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #5B626E">Today</th>
              <th style="padding: 10px 20px; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #5B626E; text-align: right">Owes (advance)</th>
            </tr></thead>
            <tbody>
              <sc-for list="{{workers}}" as="w" hint-placeholder-count="10">
                <tr style="border-top: 1px solid #EEF0F3">
                  <td style="padding: 12px 20px"><span style="display: flex; align-items: center; gap: 10px"><span style="width: 36px; height: 36px; flex-shrink: 0; border-radius: 999px; background: #E3E5E9; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 12px">{{w.ini}}</span><span><a href="WorkerProfile.dc.html" style="font-weight: 600; color: #16191D; text-decoration: none">{{w.name}}</a><br><span style="font-size: 12px; color: #5B626E">{{w.id}}</span></span></span></td>
                  <td style="padding: 12px 16px">{{w.trade}}</td>
                  <td style="padding: 12px 16px">{{w.site}}</td>
                  <td style="padding: 12px 16px; font-variant-numeric: tabular-nums; color: #3F4650">{{w.phone}}</td>
                  <td style="padding: 12px 16px; text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap"><span style="font-weight: 600">{{w.rate}}</span> <span style="font-size: 12px; color: #5B626E">/ {{w.unit}}</span></td>
                  <td style="padding: 12px 16px"><span style="display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border-radius: 999px; font-size: 13px; font-weight: 600; background: {{w.bg}}; color: {{w.fg}}"><strong>{{w.letter}}</strong> {{w.status}}</span></td>
                  <td style="padding: 12px 20px; text-align: right; font-variant-numeric: tabular-nums; color: {{w.owesColor}}">{{w.owes}}</td>
                </tr>
              </sc-for>
            </tbody>
          </table>
        </div>
        <div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 20px; border-top: 1px solid #EEF0F3; font-size: 14px; color: #3F4650">
          <span>Showing 1–10 of 104</span>
          <div style="display: flex; gap: 8px">
            <button type="button" style="height: 36px; padding: 0 12px; border: 1px solid #C9CED6; border-radius: 8px; background: #FFFFFF; font: 600 13px Inter, sans-serif">Previous</button>
            <button type="button" style="height: 36px; padding: 0 12px; border: 1px solid #C9CED6; border-radius: 8px; background: #FFFFFF; font: 600 13px Inter, sans-serif">Next</button>
          </div>
        </div>
      </section>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1000}}'>
class Component extends DCLogic {
  renderVals() {
    const S = {
      P: { letter: 'P', status: 'Present', bg: '#DCF2E4', fg: '#135C33' },
      A: { letter: 'A', status: 'Absent', bg: '#FBE1DE', fg: '#9B1C13' },
      H: { letter: '½', status: 'Half day', bg: '#FDEBD2', fg: '#8A4A06' },
      L: { letter: 'L', status: 'Late', bg: '#DDE8F8', fg: '#1A4C99' },
      N: { letter: '–', status: 'Not recorded', bg: '#EEF0F3', fg: '#3F4650' }
    };
    const W = (name, id, trade, site, phone, rate, unit, s, owes) => ({
      name, id, trade, site, phone, rate, unit, ...S[s],
      owes: owes || '—', owesColor: owes ? '#8A4A06' : '#5B626E',
      ini: name.split(' ').map(p => p[0]).join('')
    });
    return {
      workers: [
        W('Yao Mensah', 'W-0142', 'Mason', 'Riverside', '+[cc] 90 12 34 56', '6 000', 'day', 'P', '4 000'),
        W('Komlan Agbeko', 'W-0119', 'Carpenter', 'Riverside', '+[cc] 91 22 10 87', '5 500', 'day', 'P'),
        W('Afi Dosseh', 'W-0177', 'Labourer', 'Riverside', '+[cc] 92 45 66 01', '3 500', 'day', 'H'),
        W('Kodjo Atsu', 'W-0088', 'Labourer', 'Market Hall', '+[cc] 93 08 77 42', '3 500', 'day', 'A', '7 000'),
        W('Akouvi Tete', 'W-0154', 'Steel fixer', 'Riverside', '+[cc] 90 63 21 09', '5 000', 'day', 'L'),
        W('Mawuli Adjovi', 'W-0021', 'Foreman', 'Market Hall', '+[cc] 91 70 03 55', '8 000', 'day', 'P'),
        W('Sena Lawson', 'W-0034', 'Foreman', 'Route 4 Bridge', '+[cc] 98 11 52 30', '8 000', 'day', 'N'),
        W('Delali Agbo', 'W-0163', 'Painter', 'Riverside', '+[cc] 92 90 48 16', '4 500', 'day', 'P'),
        W('Kafui Amedome', 'W-0201', 'Electrician', 'Market Hall', '+[cc] 99 34 25 71', '900', 'hour', 'P', '2 500'),
        W('Edo Gbedemah', 'W-0188', 'Labourer', 'Route 4 Bridge', '+[cc] 93 57 84 62', '3 500', 'day', 'N')
      ]
    };
  }
}
</script>
</body>
</html>

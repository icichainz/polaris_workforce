<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Foreman — today</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&amp;family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1A56C4}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F4F5F7; color: #16191D; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column">
  <header style="background: #16191D; color: #FFFFFF; padding: 24px 20px 20px; display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; justify-content: space-between; align-items: center">
      <button type="button" style="display: flex; flex-direction: column; align-items: flex-start; border: 0; background: transparent; color: #FFFFFF; padding: 0; font: inherit; text-align: left">
        <span style="font-size: 13px; color: #C9CDD3">Friday 31 October</span>
        <span style="display: flex; align-items: center; gap: 6px; font-family: Archivo, sans-serif; font-weight: 800; font-size: 22px">Riverside Apartments
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#F5B000" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg>
        </span>
      </button>
      <span style="width: 40px; height: 40px; border-radius: 999px; background: #2E343C; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px">KA</span>
    </div>
    <div style="display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 10px; background: #2A3038; font-size: 14px">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#F5B000" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M2 2l20 20M8.5 16.5a5 5 0 0 1 7 0M5 12.9a10 10 0 0 1 5.2-2.8M19 12.9a10 10 0 0 0-2-1.5M12 20h.01"></path></svg>
      <span style="flex-grow: 1"><strong>Offline</strong> · works normally</span><span style="color: #C9CDD3">0 waiting</span>
    </div>
  </header>

  <main style="flex-grow: 1; padding: 20px; display: flex; flex-direction: column; gap: 16px; overflow: hidden">
    <section style="background: #FFFFFF; border: 2px solid #16191D; border-radius: 14px; padding: 18px; display: flex; flex-direction: column; gap: 12px">
      <div style="display: flex; justify-content: space-between; align-items: center">
        <span style="font-size: 13px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #8A5A00">Morning · due 08:00</span>
        <span style="display: inline-flex; align-items: center; height: 26px; padding: 0 10px; border-radius: 999px; background: #EEF0F3; color: #3F4650; font-size: 13px; font-weight: 600">Not started</span>
      </div>
      <h1 style="margin: 0; font-family: Archivo, sans-serif; font-weight: 800; font-size: 26px">Roll call</h1>
      <span style="font-size: 16px; color: #3F4650">42 workers on your crew list</span>
      <a href="MobileRollCall.dc.html" style="height: 56px; border-radius: 12px; background: #F5B000; color: #16191D; font-weight: 700; font-size: 17px; display: flex; align-items: center; justify-content: center; text-decoration: none">Start roll call</a>
    </section>

    <section style="background: #FFFFFF; border: 1px solid #E3E5E9; border-radius: 14px; padding: 18px; display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; justify-content: space-between; align-items: center">
        <span style="font-size: 13px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #5B626E">Evening</span>
        <span style="display: inline-flex; align-items: center; height: 26px; padding: 0 10px; border-radius: 999px; background: #EEF0F3; color: #3F4650; font-size: 13px; font-weight: 600">After approval</span>
      </div>
      <h2 style="margin: 0; font-family: Archivo, sans-serif; font-weight: 700; font-size: 20px">Cash payout</h2>
      <span style="font-size: 15px; color: #3F4650">Opens once the site manager approves today’s roll call.</span>
      <a href="MobilePayout.dc.html" style="height: 52px; border-radius: 12px; border: 2px solid #16191D; color: #16191D; font-weight: 700; font-size: 16px; display: flex; align-items: center; justify-content: center; text-decoration: none">Preview tonight’s payout</a>
    </section>

    <section style="display: flex; flex-direction: column; gap: 8px">
      <h2 style="margin: 0; font-size: 13px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #5B626E">This week</h2>
      <sc-for list="{{days}}" as="d" hint-placeholder-count="4">
        <div style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; background: #FFFFFF; border: 1px solid #E3E5E9; border-radius: 12px; font-size: 15px">
          <span style="flex-grow: 1; font-weight: 600">{{d.day}}</span>
          <span style="font-variant-numeric: tabular-nums; color: #3F4650">{{d.count}}</span>
          <span style="display: inline-flex; align-items: center; height: 26px; padding: 0 10px; border-radius: 999px; font-size: 13px; font-weight: 600; background: {{d.bg}}; color: {{d.fg}}">{{d.status}}</span>
        </div>
      </sc-for>
    </section>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      days: [
        { day: 'Thu 30', count: '40 / 42', status: 'Paid', bg: '#DCF2E4', fg: '#135C33' },
        { day: 'Wed 29', count: '39 / 42', status: 'Locked', bg: '#16191D', fg: '#FFFFFF' },
        { day: 'Tue 28', count: '41 / 42', status: 'Locked', bg: '#16191D', fg: '#FFFFFF' }
      ]
    };
  }
}
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sites</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&amp;family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1A56C4}a:hover{color:#123E8F}
</style>
</helmet>
<div style="min-height: 100vh; display: flex; flex-wrap: wrap; background: #F4F5F7; color: #16191D; font-family: Inter, system-ui, sans-serif">
  <div style="flex: 1 1 248px; max-width: 100%; background: #16191D">
    <dc-import name="Sidebar" active="sites" hint-size="248px,960px"></dc-import>
  </div>
  <main style="flex: 999 1 560px; min-width: 0; box-sizing: border-box; padding: 28px 32px 56px">
    <div style="max-width: 1200px; margin: 0 auto; display: flex; flex-direction: column; gap: 24px">
      <header style="display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px">
        <div style="display: flex; flex-direction: column; gap: 4px">
          <span style="font-size: 13px; font-weight: 600; color: #5B626E">3 active · 1 paused · 4 completed</span>
          <h1 style="margin: 0; font-family: Archivo, sans-serif; font-weight: 800; font-size: 32px">Sites</h1>
        </div>
        <button type="button" style="height: 40px; padding: 0 16px; border: 0; border-radius: 8px; background: #F5B000; color: #16191D; font: 600 14px Inter, sans-serif">New site</button>
      </header>

      <div style="display: flex; flex-wrap: wrap; gap: 12px; align-items: center">
        <div role="tablist" aria-label="Site status" style="display: flex; gap: 4px; padding: 4px; background: #E9EBEF; border-radius: 10px">
          <button type="button" role="tab" aria-selected="true" style="height: 34px; padding: 0 14px; border: 0; border-radius: 7px; background: #FFFFFF; color: #16191D; font: 600 14px Inter, sans-serif">Active · 3</button>
          <button type="button" role="tab" aria-selected="false" style="height: 34px; padding: 0 14px; border: 0; border-radius: 7px; background: transparent; color: #3F4650; font: 600 14px Inter, sans-serif">Paused · 1</button>
          <button type="button" role="tab" aria-selected="false" style="height: 34px; padding: 0 14px; border: 0; border-radius: 7px; background: transparent; color: #3F4650; font: 600 14px Inter, sans-serif">Completed · 4</button>
        </div>
        <label style="flex: 1 1 260px; max-width: 360px; display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 12px; border: 1px solid #C9CED6; border-radius: 8px; background: #FFFFFF">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#5B626E" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M11 18a7 7 0 1 0 0-14 7 7 0 0 0 0 14zM21 21l-4.3-4.3"></path></svg>
          <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Search sites</span>
          <input type="search" placeholder="Search by name or address" style="border: 0; outline: none; flex-grow: 1; font: 400 14px Inter, sans-serif; min-width: 0">
        </label>
      </div>

      <section style="display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 16px">
        <sc-for list="{{sites}}" as="s" hint-placeholder-count="3">
          <article style="background: #FFFFFF; border: 1px solid #E3E5E9; border-radius: 10px; padding: 20px; display: flex; flex-direction: column; gap: 16px">
            <div style="display: flex; justify-content: space-between; gap: 12px">
              <div style="display: flex; flex-direction: column; gap: 4px">
                <a href="SiteDetail.dc.html" style="font-family: Archivo, sans-serif; font-weight: 700; font-size: 19px; color: #16191D; text-decoration: none">{{s.name}}</a>
                <span style="font-size: 13px; color: #5B626E">{{s.address}}</span>
              </div>
              <span style="align-self: flex-start; display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border-radius: 999px; background: #DCF2E4; color: #135C33; font-size: 13px; font-weight: 600; white-space: nowrap"><span style="width: 7px; height: 7px; border-radius: 999px; background: #135C33"></span>Active</span>
            </div>
            <dl style="margin: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 16px; font-size: 14px">
              <div><dt style="font-size: 12px; color: #5B626E">Site manager</dt><dd style="margin: 2px 0 0; font-weight: 600">{{s.manager}}</dd></div>
              <div><dt style="font-size: 12px; color: #5B626E">Foreman</dt><dd style="margin: 2px 0 0; font-weight: 600">{{s.foreman}}</dd></div>
              <div><dt style="font-size: 12px; color: #5B626E">Workers assigned</dt><dd style="margin: 2px 0 0; font-weight: 600; font-variant-numeric: tabular-nums">{{s.workers}}</dd></div>
              <div><dt style="font-size: 12px; color: #5B626E">Pay</dt><dd style="margin: 2px 0 0; font-weight: 600">{{s.pay}} <span style="font-weight: 400; font-size: 12px; color: #5B626E">{{s.payNote}}</span></dd></div>
            </dl>
            <div style="display: flex; flex-direction: column; gap: 6px; padding-top: 12px; border-top: 1px solid #EEF0F3">
              <div style="display: flex; justify-content: space-between; font-size: 13px"><span style="color: #3F4650">Present today</span><span style="font-weight: 600; font-variant-numeric: tabular-nums">{{s.present}} / {{s.workers}}</span></div>
              <span style="height: 6px; border-radius: 999px; background: #EEF0F3; overflow: hidden"><span style="display: block; height: 6px; background: #135C33; width: {{s.pct}}"></span></span>
            </div>
          </article>
        </sc-for>
        <button type="button" style="min-height: 240px; border: 2px dashed #C9CED6; border-radius: 10px; background: transparent; color: #3F4650; font: 600 15px Inter, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#3F4650" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
          Add a site
          <span style="font-weight: 400; font-size: 13px; color: #5B626E">One site or many — same app</span>
        </button>
      </section>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const sites = [
      { name: 'Riverside Apartments', address: '[Street address], Block B', manager: 'Edem Kpodar', foreman: 'Kossi Amegah', workers: 42, present: 38, pay: 'Daily', payNote: 'company default' },
      { name: 'Market Hall Renovation', address: '[Street address], Central market', manager: 'Ama Fiagbe', foreman: 'Mawuli Adjovi', workers: 34, present: 31, pay: 'Daily', payNote: 'company default' },
      { name: 'Route 4 Bridge', address: '[Road], km 12', manager: 'Edem Kpodar', foreman: 'Sena Lawson', workers: 28, present: 17, pay: 'Weekly', payNote: 'site override' }
    ].map(s => ({ ...s, pct: Math.round(100 * s.present / s.workers) + '%' }));
    return { sites };
  }
}
</script>
</body>
</html>
